<!-- ⚠️ 이 줄은 배포본에만 있다(정본 glowhalo-dev 에는 없음).
     2026-09-26 회장 승인으로 "테스트용"으로만 올린 것이라 검색엔진에 잡히면 안 된다.
     테스트가 끝나면 이 폴더째 내린다. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="애기야가자·맘카페·인스타에서 발견한 곳을, 링크만 붙여넣으면 바로 저장해두는 육아 전용 지도 메모장 — 자동 구분값 제안, 만족도, 즐겨찾기, 목록 파일 공유" />
<!-- 서비스워커 등록은 **폰트보다 먼저** 해야 한다.
     아래 @import가 응답을 못 받으면 그 스타일시트가 뒤따르는 스크립트 실행을 막는다.
     그래서 등록을 본문 스크립트에 두면 네트워크가 느리거나 끊긴 첫 방문에서 **등록 자체가 일어나지 않고**,
     다음 방문에도 오프라인이 안 되는데 아무도 모른다. (실측으로 확인했다 — 2026-09-25 큐 3.)
     여는 데 드는 비용이 거의 없고 나머지 코드에 기대지 않으므로 여기 둔다. -->
<script>
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(err => console.error("SW 등록 실패", err));
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing:border-box; }
  /* 한글은 브라우저 기본값이 **음절 단위 아무 데서나 개행**이다. 좁은 폭에서 문구가 조금만 길어지면

     오히려 빠뜨리기 쉬워서다. ⚠️ 대신 **긴 영문 토큰이 반대로 넘치는 것**을 같이 막는다 —
     장소 이름에 영문이 들어올 수 있고, 안내문에 `KAKAO_APP_KEY` 같은 식별자가 있다.
     `break-word`는 한 낱말이 줄을 통째로 넘칠 때만 끊으므로 한글 문장에는 영향이 없다.
     ⚠️ `anywhere`를 몸통에 걸어 봤더니 **한글과 로고까지 아무 데서나 끊겼다**(`PLACE REGISTR/Y`).
     그래서 몸통은 `break-word`로 두고, 사용자가 넣은 글자가 들어오는 자리에만 따로 건다(아래). */
  body { margin:0; background:#EFE4D8; font-family:'Noto Sans KR',sans-serif; display:flex; justify-content:center;

  .type-emoji-input { width:36px; flex-shrink:0; text-align:center; border-radius:8px; padding:6px 4px; border:1px dashed #EDE0D2; background:#FDF9F4; font-size:13px; color:#3B2E2A; font-family:inherit; }

  .type-emoji-input:focus, .type-name-input:focus { outline:none; border-color:#FF7B54; }
  .type-add-btn { flex-shrink:0; padding:6px 12px; border-radius:8px; border:none; background:#EDE0D2; color:#fff; font-size:11px; font-weight:500; cursor:pointer; }
  .draft textarea { width:100%; font-size:14px; border-radius:8px; padding:8px 12px; margin-bottom:12px; border:1px solid #EDE0D2; background:#FDF9F4; color:#3B2E2A; resize:none; box-sizing:border-box; font-family:'Noto Sans KR',sans-serif; }
  .locbtn { width:100%; padding:9px; border-radius:8px; border:1px dashed #FFB69A; background:#FFF6F1; color:#9E4B34; font-size:12px; font-weight:500; cursor:pointer; margin-bottom:12px; }
  .locbtn.set { border-style:solid; border-color:#EDE0D2; background:#FDF9F4; color:#5C564F; }
  .draft .save { width:100%; padding:10px; border-radius:12px; border:none; background:#3B2E2A; color:#FDF4EC; font-size:14px; font-weight:500; cursor:pointer; }

  .filters { padding:20px 20px 0; display:flex; align-items:center; gap:6px; overflow-x:auto; }
  /* 좁은 화면에서는 가로로 밀지 않고 접는다 — 320px에서 오른쪽이 잘려 보였다(3차 심사 ⚪ 참고).
     스크롤은 되지만 "여기 더 있다"가 보이지 않으면 없는 것과 같다. */
  @media (max-width: 380px) {
    .filters { flex-wrap:wrap; overflow-x:visible; row-gap:6px; }
    /* 접는 모드에서는 칩이 **줄어들 수 있어야** 한다. `flex-shrink:0`은 가로로 미는 모드에서

    .fbtn { flex-shrink:1; max-width:100%; }
  }
  .fbtn { flex-shrink:0; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:500; border:1px solid #EDE0D2; background:#fff; color:#5C564F; cursor:pointer; }
  .fbtn.active { background:#3B2E2A; color:#FDF4EC; }

  .favbtn.active { background:#FFD966; }

  .typemgr { margin:8px 20px 0; display:flex; flex-direction:column; gap:6px; }

  .typemgr-del { flex-shrink:0; background:none; border:none; cursor:pointer; font-size:10px; color:#655E56; }
  .typemgr-del.confirm { color:#fff; background:#E0574C; padding:5px 10px; border-radius:8px; font-weight:500; font-size:11px; }

  .listbar { padding:10px 20px 0; }

  .clearbtn { background:none; border:none; cursor:pointer; color:#655E56; font-size:12px; padding:0 4px; opacity:0; pointer-events:none; }
  .clearbtn.show { opacity:1; pointer-events:auto; }
  .sortrow { padding:8px 20px 0; display:flex; gap:6px; overflow-x:auto; }
  .sortsep { flex-shrink:0; width:1px; align-self:stretch; background:#EDE0D2; margin:0 2px; }
  .sortbtn { flex-shrink:0; padding:5px 11px; border-radius:999px; font-size:11px; font-weight:500; border:1px solid #EDE0D2; background:#fff; color:#5C564F; cursor:pointer; }
  .sortbtn.active { background:#3B2E2A; color:#FDF4EC; }
  /* 여기도 `.filters`와 같은 문제였다 — 그때는 구분 칩 줄만 고치고 정렬행은 그대로 뒀다.
     실측(23회차): 한 줄에 필요한 폭이 823px인데 폰은 320~390px이다. 그래서 **후기 필터 4개가
     320·360·375·390px 어디서도 초기 화면에 없었다.** 가로 스크롤은 되지만,
     위에 적어 둔 그대로 "여기 더 있다"가 보이지 않으면 없는 것과 같다. 그러니 접는다. */
  @media (max-width: 860px) {
    .sortrow { flex-wrap:wrap; overflow-x:visible; row-gap:6px; }
    /* 접으면 구분선은 세로줄이 아니라 **줄바꿈**이 된다 — 정렬 / 후기 두 무리로 갈린다.
       세로 1px짜리로 두면 줄이 접히는 자리에 따라 아무 데나 떠 버린다. */
    .sortsep { width:100%; height:0; align-self:auto; background:none; margin:0; }
    /* 라벨이 길어져도 화면을 밀지 않게 — `.fbtn`에 건 것과 같은 안전장치다. */
    .sortbtn { max-width:100%; }
  }
  .groupbtn.active { background:#3AAFA9; }

  .pcard-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  /* 예시 데이터 경고. 맨 아래 작은 글씨로는 안 읽힌다 — 내용보다 **위**에 둔다.
     (자매 앱 dividend-passbook f18f7ec의 .example-banner를 이 앱 팔레트에 맞춘 것) */
  /* 읽지 못한 저장값 안내. 예시 배너와 같은 골격을 쓰지만 색을 달리해 더 센 경고로 읽히게 한다. */

  .broken-banner .eb-body { color:#7A2A2A; }
  .broken-banner .eb-btn { background:#8E2F2F; }
  .broken-banner .eb-btn.plain { background:#FDF4EC; color:#8E2F2F; border:1px solid #E0A9A9; margin-top:8px; }

  .example-banner .eb-title { font-size:14px; font-weight:700; }
  .example-banner .eb-body { font-size:12px; line-height:1.6; margin-top:4px; color:#7A3D2A; }
  .example-banner .eb-btn { margin-top:10px; width:100%; padding:11px; border:0; border-radius:8px; background:#9E4B34; color:#FDF4EC; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; }
  .infobadge { font-size:10px; font-weight:600; padding:2px 7px; border-radius:999px; color:#5C564F; background:#fff; border:1px solid #EDE0D2; }
  /* 사용자가 넣은 값이 들어오는 자리. 끊길 데 없는 긴 영문 한 낱말이 오면 `break-word`로는 부족해
     화면이 가로로 밀린다(320px에서 470px까지 밀렸다 — **이 변경 전부터 있던 것**이고 main도 같다).
     `anywhere`는 최소너비 계산에도 반영돼서 실제로 줄어든다. 여기만 좁게 건다. */
  /* 사용자가 친 글자가 화면에 나오는 자리 **전부**. grep으로 뽑아 목록을 대조했다(STATUS 참고).
     처음에 눈에 띄는 넷만 넣고 **구분값(`.badge`)을 빠뜨려 5차 심사에서 반려됐다** — 그래서
     지금은 목록을 세어 놓고 거기서 고른다.
     ⚠️ flex 행 안에서는 `overflow-wrap`만으로 안 줄어든다 — `min-width:0`이 같이 있어야
     flex의 `min-width:auto` 기본값을 풀어 실제로 좁아진다. */
  .pname, .paddr, .pmemo, .draft-addr,
  .badge, .fbtn, .chip, .ub-text, .region-header, .searchrow b, .searchrow span, .typemgr-row
    { overflow-wrap:anywhere; min-width:0; }
  .pname { font-size:14px; font-weight:500; color:#3B2E2A; flex:1; min-width:0; }
  .paddr { font-size:11px; color:#B98B4E; }
  /* 메모는 한 줄로 자른다 — 목록을 훑는 화면이라 카드 높이가 들쭉날쭉하면 안 된다.
     전체 내용은 카드를 탭해 수정 모드에서 본다. */
  .pmemo { font-size:12px; line-height:1.5; color:#655E56; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .satrow { display:flex; gap:4px; flex-shrink:0; }

  .satbtn:disabled { cursor:default; opacity:.7; }
  /* 터치 영역은 44×44가 권장이다(이전 실측 32×16). 아기 안고 한 손 엄지로 쓰는 앱이다.
     보이는 글씨 크기는 그대로 두고 **영역만** 넓힌다. */
  .delbtn { background:none; border:none; cursor:pointer; font-size:10px; color:#655E56;
    min-width:44px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; }
  .delbtn.confirm { color:#fff; background:#E0574C; border-radius:8px; font-weight:500; font-size:11px; }

  /* 되돌리기 — 자동으로 사라지지 않는다. 놓쳐서 잃는 자리를 또 만들지 않기 위해서다. */
  .undo-bar { margin:0 20px 12px; padding:12px 14px; border-radius:12px; background:#3B2E2A; color:#FDF4EC;
    display:flex; align-items:center; gap:10px; }
  .undo-bar .ub-text { flex:1; font-size:12px; line-height:1.5; }
  .undo-bar .ub-undo { border:0; border-radius:8px; padding:10px 14px; min-height:44px; background:#FDF4EC; color:#3B2E2A;
    font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; flex-shrink:0; }
  .undo-bar .ub-close { border:0; background:none; color:#D8C9BC; font-size:16px; cursor:pointer;
    min-width:44px; min-height:44px; flex-shrink:0; }

  .footnote { margin:0 20px 32px; border-radius:12px; padding:14px; background:#F3E7D9; color:#5C564F; font-size:11px; line-height:1.6; }

  .sharebtn { background:none; border:none; cursor:pointer; font-size:12px; color:#9E4B34; margin-left:auto; padding:4px 8px; border-radius:999px; border:1px solid #FFD9C7; }
  /* 짧은 **고정** 라벨은 쪼개지지 않게 한다. 사용자 값이 들어오는 자리(`.badge`·`.chip`·`.fbtn`)에는
     절대 걸지 않는다 — 거기서는 쪼개지는 게 아니라 줄어드는 게 맞다. */
  .sharebtn, .satbtn, .sortbtn, .eb-btn, .ub-undo { white-space:nowrap; }
  .sharebtn { flex-shrink:0; }
  .sharebtn + .sharebtn { margin-left:0; }
  .sharebtn.plain { margin-left:4px; }

  .pin { width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.3); border:2px solid #fff; cursor:pointer; }
  .pin span { transform:rotate(45deg); font-size:14px; }
  .pin span.pin-multi { font-size:10px; letter-spacing:-1px; }

  .picker-overlay { position:fixed; inset:0; z-index:50; background:#FDF4EC; display:flex; flex-direction:column; }
  .picker-overlay.hidden { display:none; }
  .picker-map { flex:1; position:relative; }
  .picker-pin { position:absolute; top:50%; left:50%; transform:translate(-50%,-100%); font-size:32px; pointer-events:none; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.3)); z-index:1; }
  .picker-top { position:absolute; top:0; left:0; right:0; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; background:linear-gradient(rgba(0,0,0,0.35), transparent); z-index:2; }
  .picker-top span { color:#fff; font-size:12px; }
  .picker-top button { background:rgba(255,255,255,0.9); border:none; border-radius:999px; width:28px; height:28px; cursor:pointer; }
  .picker-bottom { padding:14px 20px 24px; display:flex; gap:10px; background:#FDF4EC; }
  .picker-bottom button { flex-shrink:0; padding:12px 14px; border-radius:12px; border:1px solid #EDE0D2; background:#fff; font-size:13px; cursor:pointer; }
  .picker-bottom .save { flex:1; border:none; background:#3B2E2A; color:#FDF4EC; font-weight:500; }
</style>
</head>
<body>
<div class="app">

    <div class="taghead">

<script>
const KAKAO_APP_KEY = "506c92e31aa00061f08cbc64599bf63c";

const BASE_TYPES = [
  { key:"야외놀이", color:"#3AAFA9", icon:"🌳" },
  { key:"실내놀이", color:"#6C8EBF", icon:"🎠" },
  { key:"식당", color:"#FF7B54", icon:"🍽️" },
  { key:"카페", color:"#B98B4E", icon:"☕" },
  { key:"숙소", color:"#8E6C97", icon:"🛏️" },
  { key:"기타", color:"#8C8378", icon:"📍" },
];
const TYPE_PRIORITY = ["야외놀이", "실내놀이", "식당", "카페", "숙소", "기타"]; // 핀 대표 아이콘 우선순위 — 노는 것 위주
const LEGACY_TYPE_MAP = { "놀곳":"야외놀이", "먹을곳":"식당" }; // 구 분류값 호환 — 저장된 데이터는 그대로 두고 표시할 때만 변환
const DEFAULT_TYPE_INFO = { color:"#8C8378", icon:"📍" }; // 삭제된 커스텀 구분값 등 매칭 실패 시 안전한 기본값
const CUSTOM_TYPE_COLORS = ["#5B8C5A","#C97064","#4F86C6","#A2678A","#D4A24C","#5C9EAD","#9C6644","#6F7CB3"]; // 커스텀 구분값 자동 배정 팔레트 — 순환 배정

// 사용자가 추가한 커스텀 구분값. 기본 6종(BASE_TYPES)에 이어붙여 화면에선 늘 allTypes()를 통해서만 참조한다.
let customTypes = [];
const TYPES_STORAGE_KEY = "baby-place-registry:customTypes";

function allTypes(){ return [...BASE_TYPES, ...customTypes]; }
function typePriorityList(){ return [...TYPE_PRIORITY, ...customTypes.map(t => t.key)]; } // 커스텀 타입은 우선순위 끝에 붙임
function nextCustomColor(){ return CUSTOM_TYPE_COLORS[customTypes.length % CUSTOM_TYPE_COLORS.length]; }

function normalizeTypes(p){
  let arr;
  if(Array.isArray(p.types) && p.types.length) arr = p.types;
  else if(p.type) arr = [p.type];
  else arr = ["기타"];
  return arr.map(t => LEGACY_TYPE_MAP[t] || t);
}
function primaryType(types){
  const order = typePriorityList();
  return order.find(k => types.includes(k)) || types[0];
}

function loadLocalTypes(){
  const saved = localStorage.getItem(TYPES_STORAGE_KEY);
  if(saved){
    try {
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed)) customTypes = parsed;
      else markStorageBroken(saved);
    } catch(e){ markStorageBroken(saved); }
  }
  lastSavedTypes = JSON.stringify(customTypes);
}
function persistTypes(){
  return writeLocal(TYPES_STORAGE_KEY, JSON.stringify(customTypes), () => {
    lastSavedTypes = JSON.stringify(customTypes);
  });
}

function createCustomType(nameRaw, iconRaw){
  const key = (nameRaw || "").trim();
  if(!key) return null;
  if(allTypes().some(t => t.key === key)){
    alert(`"${key}" 구분값은 이미 있어요.`);
    return null;
  }
  const icon = (iconRaw || "").trim() || "🏷️";
  const color = nextCustomColor();
  const newType = { key, icon, color };
  newType.id = "custom-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  customTypes = [...customTypes, newType];
  // 저장이 실패하면 `persistTypes()`가 화면 상태까지 되돌린다. 그때 **성공을 돌려주면 안 된다** —
  // 부르는 쪽이 이 값을 그 장소의 구분값으로 배정해서, **존재하지 않는 구분값이 붙은 장소**가 생긴다.
  // (자율 QA 실측 2026-09-25: 공간을 채운 뒤 부르면 저장은 실패했는데 성공을 돌려줬다.)
  if(!persistTypes()){
    renderFilters();
    return null;
  }
  renderFilters();
  return newType;
}

function typeAddRowHtml(extraAttr){
  return `
    <div class="typeaddrow" ${extraAttr}>
      <input class="type-emoji-input" maxlength="4" placeholder="🏷️" aria-label="새 구분 아이콘" />
      <input class="type-name-input" placeholder="+ 새 구분 추가" aria-label="새 구분 이름" />
      <button type="button" class="type-add-btn">추가</button>
    </div>`;
}
/* 구분 추가 줄은 등록 폼(#addwrap)과 수정 카드(#list) 양쪽에 들어가고, 둘 다 innerHTML로 갈린다.
   그래서 개별 요소가 아니라 document에 한 번만 건다 — 목록 위임과 같은 방식이다.
   (3차 심사 ⚪ 참고: 여기만 인라인 핸들러가 남아 "전부 걷어냈다"는 주석과 어긋났다.
    사용자 값이 들어가는 자리가 아니라 XSS는 아니었지만, 주석이 거짓말을 하고 있었다.) */
function wireTypeAddDelegation(){
  document.addEventListener("click", e => {
    const btn = e.target.closest(".type-add-btn");
    if(btn) handleTypeAddClick(btn);
  });
  document.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    const input = e.target.closest(".type-name-input");
    if(!input) return;
    e.preventDefault();
    const btn = input.closest(".typeaddrow").querySelector(".type-add-btn");
    if(btn) handleTypeAddClick(btn);
  });
}

function handleTypeAddClick(btn){
  const row = btn.closest(".typeaddrow");
  const nameInput = row.querySelector(".type-name-input");
  const emojiInput = row.querySelector(".type-emoji-input");
  const nt = createCustomType(nameInput.value, emojiInput.value);
  if(!nt) return;
  if(row.dataset.kind === "draft" && draft){
    draft.types = [...draft.types, nt.key];
    renderAdd();
  } else if(row.dataset.kind === "edit" && editingId === row.dataset.editId && editBuffer){
    editBuffer.types = [...editBuffer.types, nt.key];
    renderList();
  }
}

let typeManagerOpen = false;
let pendingTypeDeleteKey = null;
let pendingTypeDeleteTimer = null;
function renderTypeManager(){
  const el = document.getElementById("type-manager");
  if(!el) return;
  if(!typeManagerOpen || customTypes.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="typemgr">` + customTypes.map(t => `
    <div class="typemgr-row" data-key="${esc(t.key)}">
      <span class="typemgr-badge" style="background:${esc(t.color)}">${esc(t.icon)}</span>
      <input class="typemgr-name" value="${esc(t.key)}" aria-label="구분 이름" />
      <button type="button" class="typemgr-del ${pendingTypeDeleteKey===t.key?'confirm':''}" data-key="${esc(t.key)}">${pendingTypeDeleteKey===t.key ? "삭제 확정" : "삭제"}</button>
    </div>`).join("") + `</div>`;
  el.querySelectorAll(".typemgr-name").forEach(input => {
    input.addEventListener("change", e => {
      const row = e.target.closest(".typemgr-row");
      renameCustomType(row.dataset.key, e.target.value);
    });
  });
  el.querySelectorAll(".typemgr-del").forEach(btn => {
    btn.addEventListener("click", () => requestDeleteType(btn.dataset.key));
  });
}
function renameCustomType(oldKey, newNameRaw){
  const newName = newNameRaw.trim();
  if(!newName || newName === oldKey){ renderTypeManager(); return; }
  if(allTypes().some(t => t.key === newName)){
    alert(`"${newName}" 구분값은 이미 있어요.`);
    renderTypeManager();
    return;
  }
  customTypes = customTypes.map(t => t.key===oldKey ? {...t, key:newName} : t);
  places = places.map(p => (p.types||[]).includes(oldKey) ? {...p, types:p.types.map(t => t===oldKey ? newName : t)} : p);
  persistTypes();
  persist();
  renderAll();
}
function requestDeleteType(key){
  clearTimeout(pendingTypeDeleteTimer);
  if(pendingTypeDeleteKey === key){
    pendingTypeDeleteKey = null;
    deleteCustomType(key);
    return;
  }
  pendingTypeDeleteKey = key;
  pendingTypeDeleteTimer = setTimeout(() => { pendingTypeDeleteKey = null; renderTypeManager(); }, 3000);
  renderTypeManager();
}
function deleteCustomType(key){
  // 구분값 정의만 지운다 — 이미 이 구분값을 쓰고 있는 장소의 types 문자열은 그대로 남아 데이터 손실이 없다.
  const typeDoc = customTypes.find(t => t.key === key);
  if(!typeDoc) return;
  if(filterType === key) filterType = "전체";
  customTypes = customTypes.filter(t => t.key !== key);
  persistTypes();
  renderAll();
}
/* 방문후기에 **순서**를 준다. 회장 지시의 핵심은 「최고~보통까지 보기」 —
   단일 선택이 아니라 **기준선(이상) 필터**다(B-4, 2026-09-26). */
const SATISFACTIONS = [
  { key:"최고", emoji:"😍", color:"#3AAFA9", rank:3 },
  { key:"무난", emoji:"🙂", color:"#B98B4E", rank:2 },
  { key:"별로", emoji:"😕", color:"#8C8378", rank:1 },
];
const satRank = key => (SATISFACTIONS.find(s => s.key === key) || {}).rank || 0;

/* 육아 전용 구조화 필드 — 상품 컨셉이 차별점으로 내건 것들이다.
   문서에만 있고 코드에는 없던 상태를 2026-09-18 QA가 잡았다. 기저귀대·수유실도
   자유 메모에 묻혀 있어 한눈에 못 보고 검색도 안 됐다.

   **등록할 때는 묻지 않는다.** "저장은 아무것도 기다리지 않는다"가 이 앱의 원칙이라,
   붙여넣기는 그대로 즉시 끝나고 이 값들은 카드 수정에서 나중에 채운다.
   채우면 뱃지로 보이고 목록 검색에도 걸린다.                                  */
const AGE_RANGES = [
  { key:"0~1살", emoji:"🍼" },
  { key:"1~3살", emoji:"🧸" },
  { key:"3살~",  emoji:"🛴" },
  { key:"전연령", emoji:"👪" },
];
const AMENITIES = [
  { key:"기저귀대", emoji:"🚼" },
  { key:"수유실",   emoji:"🤱" },
  { key:"유아의자", emoji:"🪑" },
  { key:"주차",     emoji:"🅿" },
];
const AGE_KEYS = AGE_RANGES.map(a => a.key);
const AMENITY_KEYS = AMENITIES.map(a => a.key);
const SEOUL_CITY_HALL = { lat:37.5665, lng:126.9780 };

// "가까운 순" 정렬 기준점(내 집 위치) — 기기별 개인 설정이라 Firestore가 아닌 localStorage에만 저장.
// 처음 쓸 땐 비어있고, "집에서 가까운순"을 처음 누를 때 지도에서 직접 찍어서 설정한다(ensureHome 참고).
const HOME_KEY = "baby-place-registry:home";
/* 저장값이 **있었는데 못 읽은** 경우를 기억한다. 아예 없는 첫 방문과 구분해야 한다.
   25회차 실측: 세 저장 키를 다 깨 봤더니 `:places`·`:customTypes`는 배너로 알려 주는데
   이 키만 조용히 `null`로 돌아갔다 — 그리고 ensureHome()이 이미 설정해 둔 사용자에게
   **첫 방문 문구**를 띄웠다. 게다가 "한 번 설정하면 계속 기억해요"라고, **방금 깨진 그 약속**을
   다시 했다. 사용자는 자기가 설정을 안 했다고 믿게 된다. 규칙 13(조용한 초기화 금지)은
   이 자리 하나가 빠져 있었다. 새 화면을 만들지 않고 아래 알림 문구만 갈랐다. */
let homeUnreadable = false;
let HOME = loadHome();
function loadHome(){
  const raw = localStorage.getItem(HOME_KEY);
  if(raw === null) return null;      // 설정한 적이 없다 — 정상
  try {
    const saved = JSON.parse(raw);
    if(saved && Number.isFinite(saved.lat) && Number.isFinite(saved.lng)) return saved;
  } catch(e){ /* 아래에서 못 읽었다고 표시한다 */ }
  homeUnreadable = true;             // 설정해 뒀는데 못 읽었다 — 조용히 넘기지 않는다
  return null;
}
function saveHome(loc){
  const prev = HOME;
  HOME = { lat:loc.lat, lng:loc.lng };
  try {
    localStorage.setItem(HOME_KEY, JSON.stringify(HOME));
    homeUnreadable = false;   // 다시 찍어 덮었으니 못 읽었던 상태는 끝났다
  } catch(err){
    HOME = prev;   // 저장 못 했으면 기억하고 있는 척하지 않는다
    alert("저장 공간이 가득 차서 집 위치를 기억하지 못했어요. 오래된 기록을 지운 뒤 다시 설정해주세요.");
  }
}
function ensureHome(onReady){
  if(HOME){ onReady(); return; }
  if(!mapReady){ alert("가까운 순 정렬을 쓰려면 지도가 필요해요. 카카오 지도 키가 설정되면 이용할 수 있어요."); return; }
  /* 「기록은 그대로」는 기록 쪽이 멀쩡할 때만 말한다. 저장값이 통째로 상하면 두 키가 같이 깨질 수 있고,
     그때 이 말을 하면 화면에 떠 있는 손상 배너와 **정면으로 어긋난다**. */
  alert(!homeUnreadable
    ? "먼저 내 위치(집)를 지도에서 설정해주세요. 한 번 설정하면 이 기기에서 계속 기억해요."
    : "저장해 둔 집 위치를 읽지 못했어요." + (storageBroken ? "" : " 기록은 그대로 있어요.") + " 집 위치만 지도에서 다시 설정해주세요.");
  openPicker(null, loc => { saveHome(loc); onReady(); });
}

/* ---------- 저장값을 읽지 못했을 때 ----------
   예전에는 `catch`가 **아무 말 없이 기본 샘플로 돌아갔다.** 그래서 이런 일이 벌어졌다
   (실측, 2026-09-25): 깨진 값이 있는 채로 열면 내 기록 대신 예시가 보이고 알림은 0건 →
   사용자가 "사라졌네" 하며 즐겨찾기를 한 번 누르면 **그 한 번이 깨진 원본을 예시로 덮어쓴다.**
   **복구 가능한 상태가 복구 불가로 바뀌는 것**이 이 결함의 본질이었다.

   그래서 손상을 알면:
     1) **아무것도 쓰지 않는다** — 마지막 사본을 지우지 않는다.
     2) 깨진 원본을 **파일로 내려받을 길**을 준다.
     3) 새로 시작하는 것은 사용자가 확인해야만 한다.
   저장 키를 더 만들지 않으려고 구조체를 메모리에만 둔다.                        */
let storageBroken = false;
let brokenRaw = null;

function markStorageBroken(raw){
  storageBroken = true;
  if(brokenRaw === null) brokenRaw = raw;
}

function downloadBroken(){
  try {
    const blob = new Blob([String(brokenRaw == null ? "" : brokenRaw)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "아기랑갈곳-읽지못한저장값.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(err){
    alert("내려받기에 실패했어요: " + (err && err.message ? err.message : err));
  }
}

function startFreshAfterBroken(){
  if(!confirm("읽지 못한 저장값을 지우고 새로 시작할까요?\n\n먼저 «읽지 못한 값 내려받기»로 파일을 빼 두는 편이 안전해요. 이 동작은 되돌릴 수 없어요.")) return;
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(TYPES_STORAGE_KEY);
  } catch(e){ /* 지우기까지 막히면 아래 상태만 풀어 준다 */ }
  storageBroken = false;
  brokenRaw = null;
  location.reload();
}

const STORAGE_KEY = "baby-place-registry:places";
let idSeq = 10;
/* ⚠️ 아래는 화면을 채워 보기 위한 **예시 데이터**다. 실제 기록이 아니다.
   `isExample`은 저장까지 따라간다 — 표시를 저장에 끌고 가야 "예시만 골라 지우기"가 성립한다.
   (재QA 반려 2번, 2026-09-21: 처음 여는 사람에게 이 셋이 자기 기록처럼 보였다.
    ⭐즐겨찾기와 😍만족도까지 켜진 채라 더 그랬다.)                              */
let places = [
  { id:"1", isExample:true, raw:"https://map.kakao.com/xxxxx", source:"link", name:"몽실놀이터", types:["놀곳"], memo:"실내라 비 와도 좋음, 주차 넉넉", favorite:true, lat:37.5665, lng:126.9780, satisfaction:"최고" },
  { id:"2", isExample:true, raw:"우리동네 국수집", source:"text", name:"우리동네 국수집", types:["먹을곳"], memo:"이유식 데워줌", favorite:false, lat:37.5651, lng:126.9895 },
  { id:"3", isExample:true, raw:"https://place.map.naver.com/yyyyy", source:"link", name:"라운드어바웃 카페", types:["카페","놀곳"], memo:"계곡 옆이라 물놀이도 가능, 유모차 자리 넓음", favorite:false, lat:37.5600, lng:126.9700 },
];
let draft = null;
let rawInput = "";
let filterType = "전체";
let favOnly = false;
let minRating = 0;   // 0 = 전체 · 1~3 = 그 등급 **이상**만
let listQuery = "";
let sortMode = "recent"; // "recent" | "name" | "distance"
let groupByRegion = false;

let addMode = "search"; // "search" | "manual" — !mapReady일 땐 항상 manual로 폴백
let searchQuery = "";
let searchResults = [];
let searchDone = false;
let searchDebounceTimer = null;
let placesService = null;

function exampleCount(){ return places.filter(p => p.isExample).length; }

// 예시만 골라 지운다. 내가 넣은 것은 남긴다 — 섞인 뒤에 통째로 지우면 그게 데이터 손실이다.
function clearExamples(){
  const n = exampleCount();
  if(n === 0) return;
  lastRemoved = snapshotRemoval(p => p.isExample, `예시 ${n}곳`);
  places = places.filter(p => !p.isExample);
  renderAll();
  withSaveIntent("delete", persist);   // 저장이 막히면 persist()가 되돌리고 알린다(저장 실패 처리 참고)
}

function nextIdSeq(){
  return places.reduce((m,p) => {
    const n = Number(p.id);
    return Number.isFinite(n) ? Math.max(m, n) : m;
  }, 0) + 1;
}

/* 손댈 수 없는 레코드를 만들지 않는다 — **유령 데이터**.
   실측(자율 QA 2026-09-27): `id`가 없거나 `null`인 레코드는 **화면에는 보이는데 지워지지 않는다.**
   카드는 `data-id="undefined"`로 그려지고, 삭제는 `x.id !== "undefined"`로 걸러서 영원히 안 맞는다.
   즐겨찾기·만족도·수정도 같은 이유로 전부 먹지 않는다. 이름이 없으면 카드에 글자 그대로
   「undefined」가 뜬다.

   손으로 고친 파일이나 옛 판본에서 올 수 있다(가져오기는 막고 있다 — `parseBackup`이 이름을
   요구하고 id를 새로 매긴다). **지우지 않고 고쳐 준다** — 남의 기록을 조용히 버리는 것보다 낫다.
   저장은 하지 않는다(손상 처리와 같은 이유). 다음 변경 때 함께 저장된다. */
function repairRecords(list){
  const seen = new Set();
  return list.map(p => {
    const out = {...p};
    const id = out.id == null ? "" : String(out.id);
    if(!id.trim() || seen.has(id)) out.id = String(idSeq++);
    else out.id = id;
    seen.add(out.id);
    if(typeof out.name !== "string" || !out.name.trim()) out.name = "이름 없음";
    return out;
  });
}

function loadLocalState(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try {
      const parsed = JSON.parse(saved);
      // 빈 배열은 "사용자가 다 지웠다"는 뜻이다 — 예시를 되살리지 않는다.
      // 되살리면 "지워지지 않는다"로 읽힌다.
      if(Array.isArray(parsed)){
        places = parsed;
        idSeq = nextIdSeq();
      }
      else markStorageBroken(saved);   // 배열이 아니면 우리 형식이 아니다
    } catch(e){ markStorageBroken(saved); }
  }
  const normalized = repairRecords(places.map(p => ({...p, types: normalizeTypes(p)})));
  /* 되돌릴 기준선. 이게 없으면 첫 저장 실패 때 돌아갈 곳이 없다.
     ⚠️ **기준선은 저장소와 같은 모양이어야 한다.** 정규화한 배열로 기준선을 잡으면
     구 분류값(`놀곳`→`야외놀이`)이 있는 데이터에서 **기준선 ≠ 저장소**가 되어,
     첫 저장 때마다 "다른 탭이 썼다"로 갈라진다. 실측(2026-09-27)으로 확인했고,
     비교가 이름·위치 기준(`sameSpot`)이라 결과는 같았지만 **모양을 어긋나게 둘 이유가 없다.**
     (다른 앱에서는 같은 어긋남이 거짓 충돌 경고로 터졌다 — ORDERS 2026-09-27.)
     그래서 읽어온 **원문 그대로**를 기준선으로 쓰고, 정규화는 화면 쪽에만 둔다. */
  lastSavedPlaces = saved && Array.isArray(places) ? saved : JSON.stringify(normalized);
  places = normalized;
}

/* ---------- 저장 실패를 삼키지 않는다 ----------
   이 앱의 모든 변경 함수는 **화면을 먼저 그리고 저장을 나중에** 부른다.
   그래서 `localStorage`가 가득 차 `setItem`이 던지면, 화면에는 이미 "됐다"고 그려진 뒤였다.
   재QA 실측(2026-09-21): 한도를 채운 상태에서 장소를 등록하면 카드가 정상적으로 뜨고 알림은 0건,
   새로고침하면 흔적 없이 사라졌다. **사용자가 잃는 걸 모른 채 잃는다.**

   그래서 저장이 실패하면 **화면을 저장된 상태로 되돌리고** 왜인지 말한다.
   되돌리지 않으면 "화면엔 있는데 실제로는 없는" 상태가 그대로 남는다.       */
let lastSavedPlaces = null;   // 마지막으로 저장에 성공한 내용. 되돌릴 때 쓴다.
let lastSavedTypes = null;
let saveBroken = false;       // 연속 실패에 같은 알림을 쏟아내지 않기 위한 표시

function writeLocal(key, json, onOk){
  if(storageBroken){
    // 마지막 사본을 지우지 않는다. 사용자가 «새로 시작»을 고르기 전까지는 아무것도 쓰지 않는다.
    if(!saveBroken){
      saveBroken = true;
      alert("저장된 기록을 읽지 못한 상태라, 덮어쓰지 않으려고 저장을 멈춰 두었어요.\n\n위 안내에서 «읽지 못한 값 내려받기»로 파일을 빼 둔 뒤 «새로 시작»을 골라주세요.");
    }
    return false;
  }
  try {
    localStorage.setItem(key, json);
    if(onOk) onOk();
    saveBroken = false;
    return true;
  } catch(err){
    rollbackToSaved(err);
    return false;
  }
}

/* 지금 저장하려는 변경이 **무엇인지**. 저장이 실패했을 때 되돌리기 기회를 어떻게 다룰지가 여기서 갈린다.
   3차 심사 지적(2026-09-23): 예전에는 실패 원인과 무관하게 `lastRemoved`를 늘 지웠다.
   그래서 A를 지워 되돌리기 바가 떠 있는데 **A와 아무 상관 없는** B의 저장이 실패하면,
   A를 되돌릴 기회가 아무 말 없이 사라졌다. "자동 타임아웃을 걸지 않는다"는 바로 위 약속과 어긋난다. */
let saveIntent = null;   // "delete" | "undo" | null(그 밖의 변경)

function withSaveIntent(intent, fn){
  const prev = saveIntent;
  saveIntent = intent;
  try { return fn(); } finally { saveIntent = prev; }
}

function rollbackToSaved(err){
  // 저장된 내용으로 화면을 되돌린다 — 저장 안 된 것을 저장된 것처럼 두지 않는다.
  try {
    if(lastSavedPlaces !== null) places = JSON.parse(lastSavedPlaces);
    if(lastSavedTypes !== null) customTypes = JSON.parse(lastSavedTypes);
  } catch(e){ /* 되돌릴 내용까지 깨졌으면 화면은 건드리지 않는다 */ }

  const why = err && err.name ? `\n\n(${err.name})` : "";
  const howTo = "\n\n💾 내보내기로 기록을 파일에 빼둔 뒤 오래된 항목을 지우면 다시 저장할 수 있어요.";

  if(saveIntent === "delete"){
    // 실패한 저장이 그 삭제 자체다. 지워진 적이 없으니 되돌릴 것도 없다.
    lastRemoved = null;
    renderAll();
    if(saveBroken) return;
    saveBroken = true;
    alert("저장 공간이 가득 차서 삭제를 저장하지 못했어요. 지워지지 않았습니다." + howTo + why);
    return;
  }

  if(saveIntent === "undo"){
    // 되돌리기가 저장되지 않았다. **기회를 없애지 않는다** — 자리를 비운 뒤 다시 누르면 된다.
    // 이건 사용자가 방금 누른 동작이 실패한 것이라, 이미 한 번 알렸더라도 반드시 말한다.
    renderAll();
    saveBroken = true;
    alert("저장 공간이 가득 차서 되돌리지 못했어요. 되돌리기는 그대로 두었으니, 자리를 비운 뒤 다시 눌러주세요." + howTo + why);
    return;
  }

  // 그 밖의 변경이 실패한 경우. 삭제는 **이미 저장돼 있고** 되돌리기만 날아가면 안 된다.
  renderAll();
  if(saveBroken) return;      // 이미 한 번 알렸으면 되돌리기만 한다
  saveBroken = true;
  alert("저장 공간이 가득 차서 방금 변경을 저장하지 못했어요. 화면을 저장된 상태로 되돌렸습니다."
    + (lastRemoved ? " (지운 항목의 되돌리기는 그대로 둡니다.)" : "") + howTo + why);
}

/* 탭을 둘 열면 각 탭이 자기 메모리의 배열을 통째로 덮어쓴다 —
   실측(자율 QA 2026-09-25): 탭1에서 등록하고 탭2에서 등록하면 **탭1의 기록이 사라진다.**
   탭2는 열 때의 상태만 알고 탭1의 추가를 모른다. (자매 앱 coach-practice가 같은 결함으로 반려됐다.)

   그래서 쓰기 직전에 **저장소가 내가 아는 것과 같은지** 본다. 다르면 다른 탭이 쓴 것이므로
   **두 쪽을 합친 뒤** 쓴다. 합치는 기준은 가져오기와 같다(`sameSpot` — 이름+위치).
   ⚠️ "저장소에 있는데 내게 없는 것"을 그냥 더하면 **내가 방금 지운 것이 되살아난다.**
   그래서 내가 마지막으로 본 저장 내용을 기준선으로 두고 셋을 대조한다 —
   다른 탭이 **더한 것**은 가져오고, 다른 탭이 **지운 것**은 내 쪽에서도 지운다. */
function mergeOtherTabWrites(){
  let stored = null;
  try { stored = localStorage.getItem(STORAGE_KEY); } catch(e){ return; }
  if(stored === null || stored === lastSavedPlaces) return;   // 다른 탭이 쓴 것이 없다
  let other = null, base = null;
  try {
    other = JSON.parse(stored);
    base = lastSavedPlaces === null ? [] : JSON.parse(lastSavedPlaces);
  } catch(e){ return; }                                       // 손상은 손상 경로가 다룬다
  if(!Array.isArray(other) || !Array.isArray(base)) return;

  // **기준선(내가 마지막으로 본 저장 내용)과 셋을 대조한다.** 그냥 "저장소에 있는데 내게 없는 것"을
  // 더하면, 내가 방금 지운 것이 다시 살아난다 — "지워지지 않는다"가 되므로 기준선이 필요하다.
  const named = x => x && typeof x.name === "string" ? { ...x, name:String(x.name) } : null;
  const has = (list, x) => list.some(y => sameSpot(x, y));

  const addedElsewhere = other.map(named).filter(Boolean).filter(o => !has(base, o) && !has(places, o));
  const deletedElsewhere = base.map(named).filter(Boolean).filter(b => !has(other, b));

  if(addedElsewhere.length === 0 && deletedElsewhere.length === 0){ lastSavedPlaces = stored; return; }
  let next = places;
  if(deletedElsewhere.length) next = next.filter(mine => !has(deletedElsewhere, mine));
  if(addedElsewhere.length) next = [...next, ...addedElsewhere.map(o => ({ ...o, id: String(idSeq++) }))];
  places = next;
  renderAll();
}

function persist(){
  mergeOtherTabWrites();
  const json = JSON.stringify(places);
  return writeLocal(STORAGE_KEY, json, () => { lastSavedPlaces = json; });
}

/* 공유 — 이름이 하는 말과 실제 동작을 맞춘다.
   예전에는 앱 주소만 복사해 놓고 그 자리에서 "목록은 따라가지 않아요"라고 알렸다.
   기대를 만들어놓고 바로 꺾는 동작이라 QA에서 반려됐다(2026-09-18).
   이제는 내보내기와 **같은 백업 파일**을 그대로 보낸다 — 받는 쪽은 가져오기로 열면 된다.
   집 위치는 백업과 마찬가지로 담기지 않는다(buildBackupPayload 주석 참고).       */
function shareList(){
  let file;
  try {
    file = new File([backupBlob()], backupFileName(), { type:"application/json" });
  } catch(err){
    // File 생성자가 없는 아주 오래된 브라우저 — 내려받기로 대체한다.
    shareFallback();
    return;
  }
  const canShareFiles = navigator.canShare && navigator.canShare({ files:[file] });
  if(navigator.share && canShareFiles){
    navigator.share({
      files: [file],
      title: "아기랑 갈 곳 목록",
      text: "아기랑 갈 곳에 모아둔 장소 목록이에요. 앱에서 '가져오기'로 열면 그대로 들어가요."
    }).catch(err => {
      // 사용자가 취소한 것은 실패가 아니다 — 아무 말도 하지 않는다.
      if(err && (err.name === "AbortError" || err.name === "NotAllowedError")) return;
      shareFallback();
    });
    return;
  }
  shareFallback();
}

// 바로 보내기가 안 되는 환경(대부분의 PC 브라우저)에서는 파일로 내려주고, 왜인지 말한다.
function shareFallback(){
  const ok = downloadBackup();
  if(ok) alert("이 브라우저는 바로 보내기를 지원하지 않아 목록 파일로 저장했어요. 메신저나 메일에 첨부해 보내면, 받는 사람이 '가져오기'로 열 수 있어요.");
}

/* ---------- 내보내기 / 가져오기 ----------
   기록이 이 기기의 localStorage에만 있다. 브라우저 데이터를 지우면 통째로 사라지므로
   파일로 빼 둘 길이 필요하다.

   집 위치(`baby-place-registry:home`)는 일부러 담지 않는다 — 기기별 개인 설정이고,
   정밀 좌표가 파일로 돌아다니는 것이 이 앱이 실제로 한 번 겪은 유출 경로다.
   다시 찍는 데 한 번 탭이면 된다. (판단이 다르면 총괄이 뒤집으면 된다.)              */

/* 가져오는 파일은 남이 만들 수도, 망가져 있을 수도 있다. 길이를 잘라 둔다 —
   실측(2026-09-25): 2만 자짜리 이름과 5만 자짜리 메모가 **아무 저항 없이 그대로 들어왔다.**
   카드 한 장이 화면을 통째로 먹고, 저장 공간도 그만큼 먹는다.                 */
const MAX_IMPORT_NAME = 100;
const MAX_IMPORT_MEMO = 2000;
const MAX_IMPORT_ADDRESS = 200;
const MAX_IMPORT_TYPE = 40;     // 구분값 이름 — 뱃지·필터 칩으로 화면에 그대로 나온다
const MAX_IMPORT_ICON = 8;      // 이모지 한두 개
const MAX_IMPORT_RAW = 500;     // 화면에 안 나오지만 저장 공간을 먹는다
const clip = (v, n) => v.length > n ? v.slice(0, n) : v;
const tooLong = (v, n) => typeof v === "string" && v.length > n;

/* 길이에만 상한을 걸어 두고 **시각에는 아무 상한이 없었다**(24회차 실측).
   파일의 `createdAt`이 숫자이기만 하면 그대로 들어와서, 1825일 미래로 적힌 기록 하나가
   최신순 맨 위에 **영원히** 굳었다 — 그 뒤로 사용자가 뭘 새로 넣어도 `Date.now()`라 못 넘는다.
   기기 시계가 앞선 폰에서 내보낸 백업이 평범한 도달 경로고, 이 앱엔 `createdAt`을 고치는 화면이
   없어 사용자가 되돌릴 방법이 없다.
   `NaN`·`Infinity`도 `typeof`는 "number"라 같이 막아 두지만, **이건 결함을 막는 게 아니다** —
   `JSON.parse`가 그 둘을 아예 못 만들어서 파일 경로로는 들어올 수 없다(검사로 확인했다: 고치기
   전 코드에서도 그 경우는 통과했다). 그래서 검사로는 안 남겼다. 헬퍼가 혼자 맞으라고 두는 것뿐이다. */
const timeOutOfRange = (v, now) => typeof v === "number" && (!Number.isFinite(v) || v > now);
const importedCreatedAt = (v, now) =>
  (typeof v !== "number" || !Number.isFinite(v)) ? now : (v > now ? now : v);

const BACKUP_APP = "baby-place-registry";
const BACKUP_FORMAT = 1;

function buildBackupPayload(){
  return {
    app: BACKUP_APP,
    format: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    places,
    customTypes
  };
}

function backupBlob(){
  return new Blob([JSON.stringify(buildBackupPayload(), null, 2)], { type:"application/json" });
}

function backupFileName(){
  const d = new Date(), pad = n => String(n).padStart(2,"0");
  return `아기랑갈곳-백업-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
}

// 내려받기에 성공했는지 돌려준다 — 공유 대체 경로가 안내 문구를 띄울지 판단하는 데 쓴다.
function downloadBackup(){
  try {
    const url = URL.createObjectURL(backupBlob());
    const a = document.createElement("a");
    a.href = url; a.download = backupFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch(err){
    // 실패를 삼키지 않는다 — 저장된 줄 알고 넘어가는 게 제일 나쁘다.
    alert("내보내기에 실패했어요: " + (err && err.message ? err.message : err));
    return false;
  }
}

function exportBackup(){
  downloadBackup();
}

function pickBackupFile(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => readBackupText(String(reader.result || ""));
    reader.onerror = () => alert("파일을 읽지 못했어요.");
    reader.readAsText(file);
  });
  input.click();
}

// 우리 백업 형식과, 장소 배열만 든 파일 둘 다 받는다.
function parseBackup(text){
  const parsed = JSON.parse(text);
  // 한 파일 안의 모든 기록이 같은 기준 시각을 쓴다 — 건마다 다시 재면 같은 파일인데 순서가 갈린다.
  const importedAt = Date.now();
  const rawPlaces = Array.isArray(parsed) ? parsed
    : (parsed && Array.isArray(parsed.places) ? parsed.places : null);
  if(!rawPlaces) return null;
  const places = rawPlaces
    .filter(p => p && typeof p === "object" && String(p.name || "").trim())
    .map(p => ({
      name: clip(String(p.name).trim(), MAX_IMPORT_NAME),
      // 잘렸다는 사실을 들고 다닌다 — 조용히 줄이면 사용자는 파일이 그대로 들어간 줄 안다.
      // 한 자리만 세면 다른 자리가 조용히 넘어간다(5차 심사: 주소·구분값에 상한이 없었다).
      trimmed: tooLong(p.name, MAX_IMPORT_NAME) || tooLong(p.memo, MAX_IMPORT_MEMO)
        || tooLong(p.address, MAX_IMPORT_ADDRESS) || tooLong(p.raw, MAX_IMPORT_RAW)
        || (Array.isArray(p.types) && p.types.some(t => tooLong(String(t), MAX_IMPORT_TYPE))),
      raw: typeof p.raw === "string" ? clip(p.raw, MAX_IMPORT_RAW) : clip(String(p.name).trim(), MAX_IMPORT_RAW),
      source: typeof p.source === "string" ? p.source : "text",
      address: typeof p.address === "string" ? clip(p.address, MAX_IMPORT_ADDRESS) : undefined,
      memo: typeof p.memo === "string" ? clip(p.memo, MAX_IMPORT_MEMO) : "",
      types: Array.isArray(p.types) && p.types.length
        ? p.types.map(t => clip(String(t), MAX_IMPORT_TYPE)) : ["기타"],
      favorite: p.favorite === true,
      satisfaction: typeof p.satisfaction === "string" ? p.satisfaction : undefined,
      ageRange: AGE_KEYS.includes(p.ageRange) ? p.ageRange : undefined,
      amenities: Array.isArray(p.amenities) ? p.amenities.filter(a => AMENITY_KEYS.includes(a)) : [],
      lat: Number.isFinite(p.lat) ? p.lat : undefined,
      lng: Number.isFinite(p.lng) ? p.lng : undefined,
      createdAt: importedCreatedAt(p.createdAt, importedAt),
      // 잘렸다는 사실을 들고 다니는 것과 같은 이유로, 시각을 고쳤다는 사실도 들고 다닌다.
      timeFixed: timeOutOfRange(p.createdAt, importedAt)
    }));
  if(places.length === 0) return null;
  const rawTypes = parsed && Array.isArray(parsed.customTypes) ? parsed.customTypes : [];
  const kept = rawTypes.filter(t => t && typeof t === "object" && String(t.key || "").trim());
  const typesTrimmed = kept.filter(t => tooLong(t.key, MAX_IMPORT_TYPE) || tooLong(t.icon, MAX_IMPORT_ICON)).length;
  const types = kept.map(t => ({
    key: clip(String(t.key).trim(), MAX_IMPORT_TYPE),
    icon: clip(String(t.icon || "🏷️"), MAX_IMPORT_ICON),
    color: String(t.color || DEFAULT_TYPE_INFO.color)
  }));
  return { places, types, typesTrimmed };
}

function sameSpot(a, b){
  if(a.name.trim().toLowerCase() !== String(b.name).trim().toLowerCase()) return false;
  if(hasLoc(a) && hasLoc(b)) return distanceKm(a, b) < 0.05;
  return !hasLoc(a) && !hasLoc(b);
}

/* 가져오기는 **장소와 구분값 두 곳을 같이** 쓴다. 따로 쓰면 앞은 저장되고 뒤가 실패해
   **반쯤 저장**이 남는다 — 실측(2026-09-25): 공간을 거의 채운 상태에서 가져오면
   구분값만 저장되고 장소는 되돌려졌는데, 알림은 "되돌렸습니다"라고만 말했다.
   (자매 앱 dividend-passbook이 정확히 이 반쯤 저장으로 반려됐다.)

   그래서 둘을 한 덩어리로 쓰고, **하나라도 실패하면 둘 다 이전 값으로 되돌린다.** */
function commitImport(){
  const prevPlacesRaw = localStorage.getItem(STORAGE_KEY);
  const prevTypesRaw = localStorage.getItem(TYPES_STORAGE_KEY);
  const prevPlaces = lastSavedPlaces, prevTypes = lastSavedTypes;
  const placesJson = JSON.stringify(places), typesJson = JSON.stringify(customTypes);
  try {
    localStorage.setItem(STORAGE_KEY, placesJson);
    localStorage.setItem(TYPES_STORAGE_KEY, typesJson);
    lastSavedPlaces = placesJson;
    lastSavedTypes = typesJson;
    saveBroken = false;
    return true;
  } catch(err){
    // 저장소를 통째로 이전으로 돌린다. 방금 실패한 쓰기가 자리를 먹지 않았으므로 되돌리기는 들어간다.
    restoreKey(STORAGE_KEY, prevPlacesRaw);
    restoreKey(TYPES_STORAGE_KEY, prevTypesRaw);
    lastSavedPlaces = prevPlaces;
    lastSavedTypes = prevTypes;
    try {
      if(prevPlaces !== null) places = JSON.parse(prevPlaces);
      if(prevTypes !== null) customTypes = JSON.parse(prevTypes);
    } catch(e){ /* 되돌릴 내용까지 깨졌으면 화면은 건드리지 않는다 */ }
    saveBroken = true;
    alert("저장 공간이 부족해서 가져오지 못했어요. 아무것도 들어가지 않았습니다 — 장소도 구분값도 그대로입니다."
      + "\n\n💾 내보내기로 기록을 파일에 빼둔 뒤 오래된 항목을 지우고 다시 시도해주세요."
      + (err && err.name ? `\n\n(${err.name})` : ""));
    return false;
  }
}

function restoreKey(key, raw){
  try {
    if(raw === null) localStorage.removeItem(key);
    else localStorage.setItem(key, raw);
  } catch(e){ /* 되돌리기까지 막히면 더 할 수 있는 게 없다 — 알림은 부르는 쪽이 한다 */ }
}

function readBackupText(text){
  let parsed = null;
  try { parsed = parseBackup(text); } catch(e){ parsed = null; }
  if(!parsed){
    alert("아기랑 갈 곳 백업 파일이 아닌 것 같아요.");
    return;
  }
  // 덮어쓰지 않는다 — 있는 것에 더하기만 한다. 되돌릴 수 없는 손실을 만들지 않기 위해서다.
  // 이미 있는 곳(이름이 같고 위치도 같은)은 건너뛴다.
  const fresh = parsed.places.filter(p => !places.some(existing => sameSpot(p, existing)));
  const skipped = parsed.places.length - fresh.length;
  const newTypes = parsed.types.filter(t => !allTypes().some(x => x.key === t.key));

  const lines = [
    `파일에 장소 ${parsed.places.length}건이 있어요.`,
    `이 중 ${fresh.length}건을 지금 목록에 더합니다.` + (skipped ? ` (이미 있는 ${skipped}건은 건너뜁니다)` : ""),
    newTypes.length ? `새 구분값 ${newTypes.length}개도 같이 추가돼요.` : "",
    "",
    "지금 있는 기록은 지우지 않아요. 계속할까요?"
  ].filter(Boolean);

  if(fresh.length === 0 && newTypes.length === 0){
    alert("파일에 있는 장소가 이미 전부 들어 있어요. 추가된 것은 없습니다.");
    return;
  }
  if(!confirm(lines.join("\n"))) return;

  newTypes.forEach(t => {
    t.id = "custom-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    customTypes = [...customTypes, t];
  });
  fresh.forEach(p => places.unshift({ ...p, id: String(idSeq++) }));   // id는 펼치기 뒤에(위 주석 참고)
  if(!commitImport()){
    // 실패 안내는 commitImport()가 한다. 여기서 "가져왔어요"라고 하면 거짓말이다.
    renderAll();
    return;
  }
  renderAll();
  const trimmed = fresh.filter(p => p.trimmed).length;
  const typesTrimmed = parsed.typesTrimmed || 0;
  const notes = [
    trimmed ? `장소 ${trimmed}건` : "",
    typesTrimmed ? `구분값 ${typesTrimmed}개` : ""
  ].filter(Boolean);
  // 시각을 고친 것도 말한다. 조용히 고치면 사용자는 파일이 그대로 들어간 줄 안다(규칙 13과 같은 이유).
  const timeFixed = fresh.filter(p => p.timeFixed).length;
  alert(`가져왔어요 — 장소 ${fresh.length}건` + (newTypes.length ? `, 구분값 ${newTypes.length}개` : "") + " 추가."
    + (notes.length ? `\n(아주 긴 글자가 있어 ${notes.join(" · ")}은 줄여서 넣었어요.)` : "")
    + (timeFixed ? `\n(등록 시각이 미래로 적힌 ${timeFixed}건은 지금 시각으로 맞췄어요.)` : ""));
}

function renderFootnote(){
  // 저장 위치는 지도 상태와 무관하게 늘 같으므로 항상 같이 알린다.
  // (예전에는 지도가 안 뜨면 그 안내만 나가면서 "공유는 그대로 됩니다"라고 잘못 알렸다.)
  const el = document.getElementById("footnote");
  // 「이 기기에만」이 무슨 뜻인지까지 말한다 — 기기를 바꾸면 기록이 사라진다(B-5 a, 회장 지시).
  const storage = "기록은 이 기기에만 저장돼요 — 다른 기기로 옮기려면 💾 내보내기로 파일을 뺀 뒤 📂 가져오기로 넣으세요.";
  if(!mapReady){
    el.textContent = `지금은 카카오맵 키가 등록되지 않아 지도와 상호명 검색을 쓸 수 없어요. 등록·분류·메모·즐겨찾기는 그대로 됩니다. ${storage}`;
  } else if(searchUsable === false){
    // 지도는 떴지만 검색은 거절당했다. "지도가 뜬다 = 검색이 된다"로 읽히지 않게 정확히 적는다.
    el.textContent = `지도는 보이지만 지금 방식으로는 상호명 검색을 쓸 수 없어요. 파일을 직접 열면(file://) 카카오가 검색을 막습니다 — 주소로 열면 됩니다. 링크 붙여넣기·직접 입력·지도에서 위치 찍기는 그대로 됩니다. ${storage}`;
  } else {
    el.textContent = `${storage} 지도에 핀이 없는 장소는 카드를 탭하면 위치를 지정할 수 있어요.`;
  }
}

function renderAll(){ renderFootnote(); renderBrokenBanner(); renderExampleBanner(); renderUndoBar(); renderAdd(); renderFilters(); renderListBar(); renderSortRow(); renderList(); renderMarkers(); }

/* 예시 데이터 경고 — 지도·목록보다 **위**에 둔다. 맨 아래 작은 글씨는 안 읽힌다는 것이 이 건의 핵심이다.
   인라인 onclick은 쓰지 않는다(이 앱은 2026-09-11에 전부 이벤트 위임으로 걷어냈다).  */
function renderUndoBar(){
  const el = document.getElementById("undo-bar");
  if(!el) return;
  if(!lastRemoved){ el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="undo-bar" role="status">
      <div class="ub-text">${esc(lastRemoved.label)} 지웠어요.</div>
      <button type="button" class="ub-undo" id="undo-btn">되돌리기</button>
      <button type="button" class="ub-close" id="undo-close" aria-label="되돌리기 안내 닫기" title="닫기">✕</button>
    </div>`;
  el.querySelector("#undo-btn").addEventListener("click", undoRemove);
  el.querySelector("#undo-close").addEventListener("click", dismissUndo);
}

/* 저장값을 읽지 못했다는 안내 — **예시 배너보다 위**에 둔다.
   이 상태에서는 화면의 목록이 내 기록이 아니라 예시라는 것을 먼저 알아야 한다. */

      <div class="eb-body">저장값이 망가진 것 같아요. <b>지금 보이는 목록은 내 기록이 아니라 예시예요.</b>
        덮어쓰지 않으려고 <b>저장을 멈춰 두었어요.</b><br>
        전에 <b>💾 내보내기</b>로 빼 둔 파일이 있으면 <b>📂 가져오기</b>로 그대로 되살릴 수 있어요.
        없으면 아래에서 읽지 못한 원본을 파일로 빼 두세요 — 나중에 살릴 여지가 남습니다.</div>
      <button type="button" class="eb-btn" id="broken-download">읽지 못한 값 내려받기</button>

// 속성값 자리에도 그대로 쓰이므로 따옴표까지 막는다. `"`만 빠져도 data-* 속성을 탈출할 수 있다.
// 색칠된 배경 위 글자색을 대비로 고른다. 구분값 색은 사용자가 만들 수도 있어서
// 흰 글자로 고정해 두면 밝은 색에서 읽기 어려워진다.
function textOn(bgHex){
  const h = String(bgHex || "").replace("#","");
  if(h.length !== 6) return "#fff";
  const ch = i => { const v = parseInt(h.slice(i,i+2),16)/255; return v <= 0.04 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  const L = 0.2126*ch(0) + 0.7152*ch(2) + 0.0722*ch(4);
  return (L + 0.05) / 0.0674 >= 1.05 / (L + 0.05) ? "#2A211E" : "#fff";
}

function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
function detectSource(raw){ return /^https?:\/\//i.test(raw.trim()) ? "link" : "text"; }
function guessName(raw){
  if(detectSource(raw)==="link"){
    try { const u = new URL(raw.trim()); return u.hostname.replace("www.","") + " 링크"; }
    catch { return "붙여넣은 링크"; }
  }
  return raw.trim();
}

/* ---- "진짜" 자동 분류: 키워드 매칭 (AI 호출 없음, 즉시 판단) ----
   순서가 중요하다 — "키즈카페"는 "카페" 문자열을 포함하므로, 더 구체적인
   실내/야외 규칙을 먼저 검사해야 엉뚱하게 "카페"로 먼저 잡히지 않는다. */
const TYPE_KEYWORD_RULES = [
  { type:"실내놀이", keywords:["키즈카페","실내놀이터","키즈풀","볼풀","트램폴린","실내체험","키즈룸","놀이방","실내키즈","베이비카페"] },
  { type:"야외놀이", keywords:["놀이터","공원","테마파크","동물원","수목원","체험농장","캠핑장","물놀이장","워터파크","전망대","목장","식물원","분수광장"] },
  { type:"식당", keywords:["맛집","식당","국수","분식","레스토랑","고깃집","한식","중식","일식","해물","곱창","냉면","돈까스","김밥","백반","이유식","키즈메뉴"] },
  { type:"카페", keywords:["카페","커피","베이커리","디저트","브런치","제과점","빵집"] },
  { type:"숙소", keywords:["호텔","펜션","리조트","스테이","모텔","게스트하우스","글램핑","풀빌라","숙박"] },
];
function guessTypeFromText(text){
  if(!text) return null;
  const hay = text.toLowerCase();
  const hit = TYPE_KEYWORD_RULES.find(rule => rule.keywords.some(k => hay.includes(k.toLowerCase())));
  return hit ? hit.type : null;
}

/* ---- "진짜" 자동 분류: 링크는 Worker가 대신 열어서 제목/설명을 가져온다 ----
   저장 자체는 절대 기다리지 않는다 — 카드는 즉시 생기고, 이 함수는 그 뒤 백그라운드에서
   실행돼 이름·구분값을 조용히 갱신한다. 사용자가 그 사이 직접 수정하면(classifying:false)
   더 이상 덮어쓰지 않는다. */
const LINK_EXTRACT_URL = "https://baby-place-registry.glowhalo.org/extract";
const CLASSIFY_STALE_MS = 2 * 60 * 1000; // 이보다 오래 "분류중"이면 UI에서 스피너를 그만 보여준다(새로고침 타이밍 등으로 영영 안 끝날 수 있어서)

async function classifyLinkInBackground(id, url){
  try {
    const res = await fetch(`${LINK_EXTRACT_URL}?url=${encodeURIComponent(url)}`);
    const json = await res.json().catch(() => ({}));
    if(!res.ok || json.error) throw new Error(json.error || `추출 실패 (${res.status})`);
    const meta = json.data || {};
    const guessedType = guessTypeFromText([meta.title, meta.description].filter(Boolean).join(" "));
    const patch = { classifying:false, classifyFailed:false };
    if(meta.title && meta.title.trim()) patch.name = meta.title.trim().slice(0,80);
    if(guessedType) patch.types = [guessedType];
    applyAutoClassifyPatch(id, patch);
  } catch(err){
    /* 실패를 **카드에 남긴다.** 예전에는 `console.warn`만 했는데, 그 문구가 하필
       「수동으로 채우면 돼요」였다 — **보이지 않는 곳에서 사용자에게 할 말을 하고 있었다.**
       실측(자율 QA 2026-09-28): 「분류중…」이 사라지고 이름이 호스트명인 카드만 남고 알림은 0건.
       그게 최종인지 실패인지 알 수 없다. 워커는 등록 도메인 밖에서 403이라 드문 경로도 아니다. */
    console.warn("링크 자동분류 실패", err);
    applyAutoClassifyPatch(id, { classifying:false, classifyFailed:true });
  }
}
function applyAutoClassifyPatch(id, patch){
  const current = places.find(p => p.id===id);
  if(current && current.classifying === false) return; // 그 사이 사용자가 이미 직접 수정 — 자동분류 결과로 덮어쓰지 않음
  if(!current) return; // 배열이 정본이라 이미 삭제됐으면 더 할 게 없음
  places = places.map(x => x.id===id ? {...x, ...patch} : x);
  renderList();
  renderMarkers();
  persist();
}

function visiblePlaces(){
  return places
    .filter(p => filterType==="전체" ? true : (p.types||[]).includes(filterType))
    .filter(p => favOnly ? p.favorite : true)
    // 기준선 이상만. 후기를 아직 안 남긴 곳은 "그 이상"에 들지 않으므로 빠진다.
    .filter(p => minRating === 0 ? true : satRank(p.satisfaction) >= minRating)
    .filter(p => matchesQuery(p, listQuery));
}
function hasLoc(p){ return Number.isFinite(p.lat) && Number.isFinite(p.lng); }

function matchesQuery(p, q){
  const query = q.trim().toLowerCase();
  if(!query) return true;
  // 대상연령·편의시설도 검색에 건다 — "기저귀대"로 찾는 것이 사실상의 필터다.
  const hay = [p.name, p.address, p.memo, p.ageRange, ...(p.types||[]), ...(p.amenities||[])]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.includes(query);
}
function getCreatedAt(p){
  const c = p.createdAt;
  if(!c) return 0;
  if(typeof c === "number") return c;
  if(typeof c.toMillis === "function") return c.toMillis();
  if(typeof c.seconds === "number") return c.seconds*1000;
  return 0;
}
function findDuplicate(draftPlace){
  const name = draftPlace.name.trim().toLowerCase();
  if(!name) return null;
  return places.find(p => {
    if(p.name.trim().toLowerCase() !== name) return false;
    if(draftPlace.address && p.address) return draftPlace.address.trim().toLowerCase() === p.address.trim().toLowerCase();
    if(hasLoc(draftPlace) && hasLoc(p)) return distanceKm(draftPlace, p) < 0.05;
    return true; // 이름은 같은데 주소·좌표로 구분이 안 되면 일단 중복 후보로 취급
  }) || null;
}
function distanceKm(a,b){
  const R = 6371;
  const dLat = (b.lat-a.lat) * Math.PI/180;
  const dLng = (b.lng-a.lng) * Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const NO_REGION = "지역 미확인";
function extractRegion(address){
  if(!address) return null;
  const tokens = address.trim().split(/\s+/);
  let region = null;
  for(let i=0; i<Math.min(tokens.length,3); i++){
    if(/[시군구]$/.test(tokens[i])) region = tokens[i]; // 뒤쪽(더 구체적인) 시/군/구 토큰 우선 — "경기 성남시 분당구"면 분당구
  }
  return region;
}
function groupByRegionMap(list){
  const groups = new Map();
  list.forEach(p => {
    const region = extractRegion(p.address) || NO_REGION;
    if(!groups.has(region)) groups.set(region, []);
    groups.get(region).push(p);
  });
  const regions = [...groups.keys()].sort((a,b) => {
    if(a===NO_REGION) return 1;
    if(b===NO_REGION) return -1;
    return a.localeCompare(b, "ko");
  });
  return regions.map(region => ({ region, items: groups.get(region) }));
}
function sortPlaces(list){
  if(sortMode==="name") return [...list].sort((a,b) => a.name.localeCompare(b.name, "ko"));
  if(sortMode==="distance" && HOME){
    return [...list].sort((a,b) => {
      const da = hasLoc(a) ? distanceKm(HOME,a) : Infinity;
      const db = hasLoc(b) ? distanceKm(HOME,b) : Infinity;
      return da-db;
    });
  }
  return [...list].sort((a,b) => getCreatedAt(b) - getCreatedAt(a));
}

/* ---- 등록: 상호명 검색이 기본, 직접입력은 폴백 ---- */
function renderAdd(){
  const el = document.getElementById("addwrap");
  if(draft){ renderDraftForm(el); return; }
  clearDraftPreview();
  if(mapReady && searchUsable !== false && addMode === "search"){ renderSearchBox(el); return; }
  renderManualBox(el);
}

function renderManualBox(el){
  // 「링크만 붙여넣으면 저장돼요」를 **입력칸 바로 위**에 둔다(B-5 b, 회장 지시).
  // 맨 위 제목 아래에 있던 것은 붙여넣는 자리와 멀어 읽히지 않았다.
  el.innerHTML = `
    <p class="addhint">다른 데서 본 곳, 링크만 붙여넣으면 저장돼요</p>
    <div class="quickadd">
      <input id="raw-input" aria-label="링크·주소·상호명 붙여넣기" placeholder="링크, 주소, 상호명 붙여넣기" value="${esc(rawInput)}" />
      <button id="start-btn" type="button" aria-label="등록 시작">＋</button>
    </div>
    ${mapReady ? `<button type="button" class="manuallink" id="to-search-btn">🔍 상호명 검색으로</button>` : ""}`;
  const input = document.getElementById("raw-input");
  const startBtn = document.getElementById("start-btn");
  startBtn.classList.toggle("active", rawInput.trim().length>0);   // 물려받은 값에도 맞춘다
  input.addEventListener("input", e => { rawInput = e.target.value; startBtn.classList.toggle("active", rawInput.trim().length>0); });
  input.addEventListener("keydown", e => { if(e.key==="Enter") startRegister(); });
  document.getElementById("start-btn").addEventListener("click", startRegister);
  if(mapReady){
    // 모드는 **처리 방식**이지 다른 서랍이 아니다. 방금 입력한 것을 가져간다.
    // (B-8, 2026-09-27: 전환하면 입력칸이 비어 사용자가 링크를 다시 붙여넣어야 했다.)
    document.getElementById("to-search-btn").addEventListener("click", () => {
      addMode = "search"; searchQuery = rawInput; searchResults = []; searchDone = false;
      renderAdd();
      if(searchQuery.trim()) onSearchInput(searchQuery);
    });
  }
}

function renderSearchBox(el){
  // 「링크만 붙여넣으면 저장돼요」를 **입력칸 바로 위**에 둔다(B-5 b, 회장 지시).
  // 맨 위 제목 아래에 있던 것은 붙여넣는 자리와 멀어 읽히지 않았다.
  el.innerHTML = `
    <p class="addhint">다른 데서 본 곳, 링크만 붙여넣으면 저장돼요</p>
    <div class="quickadd">
      <input id="search-input" aria-label="상호명으로 검색" placeholder="상호명으로 검색 (예: OO키즈카페)" value="${esc(searchQuery)}" />
      <button id="search-btn" type="button" aria-label="검색">🔍</button>
    </div>
    <div id="search-results"></div>
    <button type="button" class="manuallink" id="to-manual-btn">✏️ 직접 입력할래요</button>`;
  const input = document.getElementById("search-input");
  input.addEventListener("input", e => { searchQuery = e.target.value; onSearchInput(searchQuery); });
  const submit = () => {
    const v = searchQuery.trim();
    if(!v) return;
    // 링크면 검색이 아니라 등록이다. 버튼·Enter도 붙여넣기와 같게 판단한다.
    if(detectSource(v) === "link"){ registerFromInput(v); return; }
    clearTimeout(searchDebounceTimer);
    runSearch(v);
  };
  input.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); submit(); } });
  document.getElementById("search-btn").addEventListener("click", submit);
  document.getElementById("to-manual-btn").addEventListener("click", () => {
    addMode = "manual"; rawInput = searchQuery; renderAdd();
  });
  renderSearchResults();
}

function renderSearchResults(){
  const el = document.getElementById("search-results");
  if(!el) return;
  if(searchResults.length){
    el.innerHTML = searchResults.map((r,i) => `
      <div class="searchitem" data-i="${i}">
        <b>${esc(r.place_name)}</b>
        <span>${esc(r.road_address_name || r.address_name || "")}</span>
      </div>`).join("");
    el.querySelectorAll(".searchitem").forEach(item => item.addEventListener("click", () => pickSearchResult(searchResults[Number(item.dataset.i)])));
  } else if(searchUsable === false){
    el.innerHTML = `<div class="searchempty">지금 방식으로는 상호명 검색을 쓸 수 없어요. 직접 입력하거나 링크를 붙여넣어주세요.</div>`;
  } else if(searchDone && searchQuery.trim()){
    el.innerHTML = `<div class="searchempty">검색 결과가 없어요. 직접 입력해보세요.</div>`;
  } else {
    el.innerHTML = "";
  }
}

/* 검색칸에 **링크를 붙여넣는 것**이 이 앱의 간판 동작이다.
   그런데 검색 모드의 입력은 무조건 `runSearch()`로 가서, 링크를 넣으면
   「검색 결과가 없어요」가 뜨고 `/extract` 워커는 한 번도 불리지 않았다 —
   **입력칸 바로 위에 「링크만 붙여넣으면 저장돼요」라고 써 놓고서** 그랬다(B-7, 2026-09-27).

   안내문을 되돌리는 게 아니라 **동작을 안내문에 맞춘다.**
   링크면 검색을 돌리지 않고 곧장 링크 등록 경로로 보낸다 — 모드 전환을 사용자에게 시키지 않는다. */
function onSearchInput(v){
  clearTimeout(searchDebounceTimer);
  searchDone = false;
  if(!v.trim()){ searchResults = []; renderSearchResults(); return; }
  if(detectSource(v) === "link"){ registerFromInput(v); return; }
  searchDebounceTimer = setTimeout(() => runSearch(v.trim()), 350);
}

// 검색칸·직접입력칸 어느 쪽에서 왔든 같은 등록 경로를 탄다.
function registerFromInput(v){
  clearTimeout(searchDebounceTimer);
  searchResults = []; searchDone = false;
  rawInput = v;
  startRegister();
}

/* 지도가 떴다고 상호명 검색이 되는 것은 아니다.
   지도 타일은 리퍼러 없이도 오지만, 상호명 검색(services)은 **카카오 콘솔에 등록된 도메인**에서만
   동작한다. 파일을 직접 열면(`file://`) 카카오가 401 `domain mismatched`로 거절한다 —
   그런데 화면에는 지도가 보이니 사용자는 앱이 고장 난 줄 안다(회장 피드백 B-2, 2026-09-26).

   `mapReady`로 판단하면 **안내문이 거짓말을 한다.** 그래서 한 번 실제로 물어보고 그 답으로 적는다. */
let searchUsable = null;   // null = 아직 모른다 · true/false = 물어본 결과

function probeSearchability(){
  if(!placesService) return;
  try {
    placesService.keywordSearch("카페", (data, status) => {
      const S = kakao.maps.services.Status;
      // 결과가 0건인 것과 거절당한 것은 다르다. 0건은 검색이 **된** 것이다.
      searchUsable = (status === S.OK || status === S.ZERO_RESULT);
      renderFootnote();
      renderAdd();
    });
  } catch(e){
    searchUsable = false;
    renderFootnote();
    renderAdd();
  }
}

function runSearch(query){
  if(!query || !placesService) return;
  if(searchUsable === false){
    searchDone = true; searchResults = [];
    renderSearchResults();
    return;
  }
  const opts = mapReady ? { location: map.getCenter() } : {};
  placesService.keywordSearch(query, (data, status) => {
    searchDone = true;
    searchResults = status === kakao.maps.services.Status.OK ? data.slice(0,6) : [];
    renderSearchResults();
  }, opts);
}

function pickSearchResult(item){
  // 검색 결과는 이미 카카오가 준 상호명·카테고리가 있어서 즉시(네트워크 대기 없이) 키워드 추정 가능
  const guessedType = guessTypeFromText([item.place_name, item.category_name].filter(Boolean).join(" "));
  draft = {
    raw: item.place_name,
    source: "search",
    name: item.place_name,
    address: item.road_address_name || item.address_name || "",
    // 모르면 모른다고 한다. 「야외놀이」로 두면 **틀린 것을 확신 있게** 보여주고,
    // 나중에 「야외놀이」로 거르면 고깃집이 딸려 나온다(B-9, 2026-09-27).
    types: [guessedType || "기타"],
    memo: "",
    lat: parseFloat(item.y),
    lng: parseFloat(item.x)
  };
  searchQuery = ""; searchResults = []; searchDone = false;
  renderAdd();
}

function draftSourceLabel(){
  if(draft.source==="search") return "🔍 검색해서 등록";
  if(draft.source==="link") return "🔗 링크에서 등록";
  return "✏️ 직접 입력";
}

        <span class="draft-src">${draftSourceLabel()}</span>

      </div>

      ${draft.address ? `<div class="draft-addr">${esc(draft.address)}</div>` : ""}
      <label>유형 (여러 개 선택 가능 — 놀면서 먹는 곳이면 둘 다)</label>
      <div class="chiprow" id="type-row"></div>
      ${typeAddRowHtml('data-kind="draft"')}
      <textarea id="draft-memo" rows="2" placeholder="메모 (주차 등)" aria-label="메모">${esc(draft.memo)}</textarea>
      <button type="button" class="locbtn ${hasLoc(draft) ? 'set' : ''}" id="loc-btn">${hasLoc(draft) ? "📍 위치 수정" : "📍 위치 설정"}</button>
      <button class="save" id="save-btn">등록하기</button>
    </div>`;
  document.getElementById("draft-name").addEventListener("input", e => draft.name = e.target.value);
  document.getElementById("draft-memo").addEventListener("input", e => draft.memo = e.target.value);
  document.getElementById("cancel-btn").addEventListener("click", () => { draft = null; renderAdd(); });
  document.getElementById("save-btn").addEventListener("click", confirmRegister);
  document.getElementById("loc-btn").addEventListener("click", () => {
    openPicker(hasLoc(draft) ? { lat:draft.lat, lng:draft.lng } : null, loc => { draft.lat = loc.lat; draft.lng = loc.lng; renderAdd(); });
  });

  document.getElementById("type-row").innerHTML = allTypes().map(t => `<div class="chip ${draft.types.includes(t.key)?'active':''}" data-t="${esc(t.key)}" style="${draft.types.includes(t.key)?`background:${t.color};color:${textOn(t.color)};`:''}">${esc(t.key)}</div>`).join("");
  document.querySelectorAll("#type-row .chip").forEach(chip => chip.addEventListener("click", () => {

    } else {
      draft.types = [...draft.types, key];
    }
    renderAdd();
  }));
}

function startRegister(){
  const raw = rawInput.trim();
  if(!raw) return;
  /* ⚠️ **사용자가 고르지 않은 좌표를 넣지 않는다.**
     예전에는 무조건 지도 중심(`currentMapCenter()`)을 박았다. 실측(2026-09-27):
     「부산 어딘가 식당」과 「제주 어딘가 카페」가 **둘 다 서울 지도 중심 좌표**로 저장됐다.
     따라온 것 셋 — 핀이 한 자리에 겹치고, 「📍 위치 미지정」이 **영영 안 뜨고**(실측 0건),
     「집에서 가까운순」이 전부 같은 거리로 계산돼 거짓말을 했다.
     **사용자는 위치를 지정한 적이 없는데 지정된 줄 안다.** 조용히 틀린 데이터가 쌓인다.

     좌표는 **검색으로 고른 경우**(`pickSearchResult`)와 **직접 찍은 경우**(`setLocationFor`·
     초안의 「📍 위치 수정」)에만 들어간다. 그 외에는 비워 둬야 「위치 미지정」이 떠서 찍을 수 있다. */
  const source = detectSource(raw);
  // 텍스트/링크 원문 자체에서 바로 뽑을 수 있는 힌트가 있으면 즉시 반영(네트워크 대기 없음).
  // 링크는 이후 confirmRegister에서 저장 직후 백그라운드로 실제 페이지 내용까지 한 번 더 확인한다.
  const guessedType = guessTypeFromText(raw);
  draft = { raw, source, name: guessName(raw), types: guessedType ? [guessedType] : ["기타"], memo:"", lat: undefined, lng: undefined };
  rawInput = "";
  renderAdd();
}
function confirmRegister(){
  if(!draft || !draft.name.trim()) return;
  const dup = findDuplicate(draft);
  if(dup && !confirm(`"${dup.name}"(으)로 이미 등록되어 있어요${dup.address ? "\n" + dup.address : ""}\n그래도 등록할까요?`)) return;
  const shouldClassify = draft.source === "link"; // 링크만 백그라운드에서 실제 페이지를 열어 재확인
  const rawUrl = draft.raw;
  const newPlace = { favorite:false, createdAt: Date.now(), classifying: shouldClassify, ...draft };
  draft = null;
  renderAdd();
  const id = String(idSeq++);
  // ⚠️ id는 **펼치기 뒤**에 놓는다. 앞에 두면 `newPlace`가 `id`를 들고 있을 때 조용히 이기고,
  // 같은 id가 둘 생긴다(자매 앱 dividend에서 실제로 났다 — ORDERS 2026-09-27).
  // 지금은 `draft`에 `id`가 없어 재현되지 않지만, 필드 하나 늘면 바로 밟는 자리다.
  places.unshift({ ...newPlace, id });
  renderList();
  renderMarkers();
  persist();
  if(shouldClassify) classifyLinkInBackground(id, rawUrl);
}
function toggleFav(id){
  const p = places.find(x => x.id===id);
  if(!p) return;
  places = places.map(x => x.id===id ? {...x, favorite: !x.favorite} : x);
  renderList();
  persist();
}
function setSatisfaction(id, key){
  const p = places.find(x => x.id===id);
  if(!p) return;
  const next = p.satisfaction===key ? null : key;
  places = places.map(x => x.id===id ? {...x, satisfaction: next} : x);
  renderList();
  persist();
}
/* ---------- 삭제 되돌리기 ----------
   재QA 반려 3번(2026-09-21): 같은 버튼 두 번째 탭에서 **즉시 영구 삭제**였고 되돌릴 길이 없었다.
   3초 타이머는 확인 상태를 푸는 용도지 되돌리기가 아니다. 방금 등록한 항목엔 백업도 없다.

   자매 앱 dividend-passbook `8644e61`의 방식을 따른다 — **자리까지 복원**하고,
   ⚠️ **자동 타임아웃을 걸지 않는다.** 놓쳐서 잃는 자리를 또 만들면 고친 게 아니다.   */
let lastRemoved = null;   // { items:[{index, place}], label }

function snapshotRemoval(pred, label){
  const items = [];
  places.forEach((p, i) => { if(pred(p)) items.push({ index:i, place:{...p} }); });
  return items.length ? { items, label } : null;
}

function undoRemove(){
  if(!lastRemoved) return;
  const next = places.slice();
  // 오름차순으로 넣어야 원래 자리로 돌아간다.
  lastRemoved.items.forEach(({ index, place }) => next.splice(Math.min(index, next.length), 0, {...place}));
  places = next;
  const restoring = lastRemoved;
  lastRemoved = null;
  renderAll();
  // 저장이 실패하면 rollbackToSaved()가 화면을 되돌린다. 되돌리기 기회는 여기서 복원한다.
  if(!withSaveIntent("undo", persist)) { lastRemoved = restoring; renderAll(); }
}
function dismissUndo(){ lastRemoved = null; renderAll(); }

function removePlace(id){
  const p = places.find(x => x.id === id);
  lastRemoved = snapshotRemoval(x => x.id === id, p ? `"${p.name}"` : "장소 1곳");
  places = places.filter(x => x.id !== id);
  renderAll();
  withSaveIntent("delete", persist);
}
let pendingDeleteId = null;
let pendingDeleteTimer = null;
function requestDelete(id){
  clearTimeout(pendingDeleteTimer);
  if(pendingDeleteId === id){
    pendingDeleteId = null;
    removePlace(id);
    return;
  }
  pendingDeleteId = id;
  pendingDeleteTimer = setTimeout(() => { pendingDeleteId = null; renderList(); }, 3000);
  renderList();
}
function setLocationFor(id){
  const p = places.find(x => x.id===id);
  openPicker(p && hasLoc(p) ? { lat:p.lat, lng:p.lng } : null, loc => {
    places = places.map(x => x.id===id ? {...x, lat:loc.lat, lng:loc.lng} : x);
    renderList();
    renderMarkers();
    persist();
  });
}
let editingId = null;
let editBuffer = null; // { name, types, memo } — 저장 누르기 전까지의 임시 수정값

function onCardClick(id){
  if(editingId === id) return;
  startEdit(id);
}
function startEdit(id){
  const p = places.find(x => x.id===id);
  if(!p) return;
  editingId = id;
  editBuffer = {
    name: p.name,
    types: [...(p.types && p.types.length ? p.types : ["기타"])],
    memo: p.memo || "",
    ageRange: AGE_KEYS.includes(p.ageRange) ? p.ageRange : null,
    amenities: Array.isArray(p.amenities) ? p.amenities.filter(a => AMENITY_KEYS.includes(a)) : []
  };
  renderList();
}
function editCancel(id){
  if(editingId !== id) return;
  editingId = null;
  editBuffer = null;
  renderList();
}
function editUpdateField(id, field, value){
  if(editingId !== id || !editBuffer) return;
  editBuffer[field] = value;
}
function editToggleType(id, key){
  if(editingId !== id || !editBuffer) return;
  if(editBuffer.types.includes(key)){
    if(editBuffer.types.length > 1) editBuffer.types = editBuffer.types.filter(t => t !== key);
  } else {
    editBuffer.types = [...editBuffer.types, key];
  }
  renderList();
}
// 대상연령은 하나만 고른다 — 같은 것을 다시 누르면 해제된다(만족도와 같은 규칙).
function editSetAge(id, key){
  if(editingId !== id || !editBuffer) return;
  editBuffer.ageRange = editBuffer.ageRange === key ? null : key;
  renderList();
}
function editToggleAmenity(id, key){
  if(editingId !== id || !editBuffer) return;
  editBuffer.amenities = editBuffer.amenities.includes(key)
    ? editBuffer.amenities.filter(a => a !== key)
    : [...editBuffer.amenities, key];
  renderList();
}
function editSave(id){
  if(editingId !== id || !editBuffer) return;
  const patch = {
    name: editBuffer.name.trim() || "이름 없음",
    types: editBuffer.types.length ? editBuffer.types : ["기타"],
    memo: editBuffer.memo,
    ageRange: editBuffer.ageRange || undefined,
    amenities: editBuffer.amenities,
    classifying: false,
    classifyFailed: false   // 사용자가 직접 채웠으니 안내를 남겨 둘 이유가 없다 // 사용자가 직접 저장했으니 이후 백그라운드 자동분류 결과로 덮어쓰지 않음
  };
  editingId = null;
  editBuffer = null;
  places = places.map(x => x.id===id ? {...x, ...patch} : x);
  renderList();
  renderMarkers();
  persist();
}

function renderSortRow(){
  const el = document.getElementById("sortrow");
  const modes = [
    { key:"recent", label:"최근 등록순" },
    { key:"name", label:"이름순" },
    { key:"distance", label:"집에서 가까운순" },
  ];
  // 방문후기 기준선. **구분값 칩 줄에 섞지 않는다** — 그 줄이 길어지면 B-3에서 줄인 게 무의미해진다.
  const ratingBtns = [
    { rank:0, label:"후기 전체" },
    { rank:3, label:"😍 최고만" },
    { rank:2, label:"🙂 무난 이상" },
    { rank:1, label:"😕 별로 이상" },
  ].map(r => `<button class="sortbtn ratebtn ${minRating===r.rank?'active':''}" type="button" data-rank="${r.rank}" aria-pressed="${minRating===r.rank}">${r.label}</button>`).join("");
  el.innerHTML = modes.map(m => `<button class="sortbtn ${sortMode===m.key?'active':''}" data-s="${m.key}">${m.label}${m.key==='distance' && !HOME ? ' 📍' : ''}</button>`).join("")
    + `<button class="sortbtn groupbtn ${groupByRegion?'active':''}" id="group-toggle">🗺️ 지역별로 묶기</button>`
    + `<span class="sortsep" aria-hidden="true"></span>` + ratingBtns;
  el.querySelectorAll(".sortbtn[data-s]").forEach(b => b.addEventListener("click", () => {
    const mode = b.dataset.s;
    if(mode === "distance"){
      if(sortMode === "distance" && HOME){
        // 이미 거리순 정렬 중일 때 다시 탭하면 내 위치(집)를 다시 설정
        openPicker({ lat:HOME.lat, lng:HOME.lng }, loc => { saveHome(loc); renderList(); });
        return;
      }
      ensureHome(() => { sortMode = mode; renderSortRow(); renderList(); });
      return;
    }
    sortMode = mode; renderSortRow(); renderList();
  }));
  document.getElementById("group-toggle").addEventListener("click", () => { groupByRegion = !groupByRegion; renderSortRow(); renderList(); });
  el.querySelectorAll(".ratebtn").forEach(b => b.addEventListener("click", () => {
    minRating = Number(b.dataset.rank);
    renderSortRow(); renderList(); renderMarkers();
  }));
}

/* 카드 3줄 — 회장이 배치를 직접 지정했다(B-3, 2026-09-26).
     1줄: 장소명 — 링크표시 — 즐겨찾기
     2줄: 장소 성격(구분값·연령·편의시설) — 방문후기(최고/무난/별로)
     3줄: 메모 — 삭제(우측 끝)
   예전에는 배지줄·이름·주소·메모·만족도줄·삭제줄로 **최대 6줄**이었고, 만족도와 삭제가 각각
   한 줄을 통째로 먹었다. 목록을 쭉 훑는 앱이라 그게 제일 컸다.

   ⚠️ **기능을 빼지 않았다.** 만족도 3단 선택·삭제 2단 확인·위치 미지정 표시 전부 그대로다.
   작게 만든 것이지 없앤 게 아니다. 주소는 회장 배치에 줄이 없어 **메모 줄에 접어 넣었다.**  */
function placeCardHtml(p){
  if(p.id === editingId && editBuffer) return placeEditCardHtml(p, editBuffer);
  const located = hasLoc(p);
  const sourceIcon = p.source==="search" ? "🔍" : p.source==="link" ? "🔗" : "";
  const stillClassifying = p.classifying && (Date.now() - getCreatedAt(p) < CLASSIFY_STALE_MS);
  const badges = (p.types||[]).map(tk => {
    const ti = allTypes().find(t=>t.key===tk) || DEFAULT_TYPE_INFO;
    return `<span class="badge" style="background:${esc(ti.color)};color:${esc(textOn(ti.color))}">${esc(tk)}</span>`;
  }).join("");
  // 주소와 메모를 한 줄에 합친다. 둘 다 없으면 3줄은 아예 그리지 않는다.
  const subText = [p.address, p.memo].filter(Boolean).map(t => esc(t)).join(" · ");
  return `
    <div class="pcard" data-id="${esc(p.id)}" data-act="card">
      <div class="pcard-l1">
        <div class="pname">${esc(p.name)}</div>
        ${sourceIcon ? `<span class="psrc">${sourceIcon}</span>` : ""}
        ${stillClassifying ? `<span class="autotag">🔎 분류중</span>` : ""}
        ${!stillClassifying && p.classifyFailed ? `<span class="autofail">🔎 이름을 못 가져왔어요 · 탭해서 수정</span>` : ""}
        <button class="starbtn" type="button" data-act="fav" data-id="${esc(p.id)}" aria-pressed="${!!p.favorite}" aria-label="즐겨찾기">${p.favorite ? "⭐" : "☆"}</button>
      </div>
      <div class="pcard-l2">
        <div class="pcard-tags">
          ${badges}
          ${babyBadgesHtml(p)}
          ${!located ? `<span class="noloc">📍 위치 미지정 · 탭해서 설정</span>` : ""}
        </div>
        <div class="satrow">${SATISFACTIONS.map(s => `<button class="satbtn ${p.satisfaction===s.key?'active':''}" style="${p.satisfaction===s.key?`background:${esc(s.color)};color:${esc(textOn(s.color))};border-color:${esc(s.color)};`:''}" data-act="sat" data-id="${esc(p.id)}" data-key="${esc(s.key)}" title="${esc(s.key)}" aria-label="방문후기 ${esc(s.key)}">${s.emoji} ${esc(s.key)}</button>`).join("")}</div>
      </div>
      <div class="pcard-l3">
        <div class="pmemo">${subText}</div>
        <button class="delbtn ${pendingDeleteId===p.id?'confirm':''}" type="button" data-act="del" data-id="${esc(p.id)}" aria-label="삭제">${pendingDeleteId===p.id ? "정말?" : "삭제"}</button>
      </div>
    </div>`;
}

function renderList(){
  const el = document.getElementById("list");
  const visible = sortPlaces(visiblePlaces());
  if(visible.length===0){
    // 필터 때문에 비었는데 "등록된 장소가 없어요"라고 하면 기록이 사라진 줄 안다.
    const filtered = listQuery.trim() || favOnly || minRating > 0 || filterType !== "전체";
    el.innerHTML = `<div class="empty">${filtered ? "조건에 맞는 장소가 없어요. 필터를 풀어보세요." : "등록된 장소가 없어요."}</div>`;
    return;
  }
  if(groupByRegion){
    el.innerHTML = groupByRegionMap(visible).map(({region, items}) => `
      <div class="region-header">${esc(region)} <span class="region-count">${items.length}</span></div>
      ${items.map(placeCardHtml).join("")}`).join("");
  } else {
    el.innerHTML = visible.map(placeCardHtml).join("");
  }
}

function showDraftPreview(){
  if(!mapReady || !draft || !hasLoc(draft)) return;
  clearDraftPreview();
  map.setLevel(4);
  map.setCenter(new kakao.maps.LatLng(draft.lat, draft.lng));
  const el = document.createElement("div");
  el.className = "pin";
  el.style.background = "#3B2E2A";
  el.innerHTML = `<span>📍</span>`;
  draftPreviewOverlay = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(draft.lat, draft.lng),
    content: el,
    yAnchor: 1
  });
  draftPreviewOverlay.setMap(map);
}
function clearDraftPreview(){
  if(draftPreviewOverlay){ draftPreviewOverlay.setMap(null); draftPreviewOverlay = null; }
}

function defaultCenter(){
  const withLoc = places.find(hasLoc);
  return withLoc ? { lat:withLoc.lat, lng:withLoc.lng } : SEOUL_CITY_HALL;
}
function currentMapCenter(){
  if(!mapReady) return defaultCenter();
  const c = map.getCenter();
  return { lat:c.getLat(), lng:c.getLng() };
}

function initMapOrFallback(){
  if(!KAKAO_APP_KEY){ renderMapPlaceholder(false); return; }
  const script = document.createElement("script");
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&autoload=false&libraries=services`;
  script.onload = () => window.kakao.maps.load(initMap);
  script.onerror = () => renderMapPlaceholder(true);
  document.head.appendChild(script);
}
function renderMapPlaceholder(loadError){
  document.getElementById("map").innerHTML = `<div class="map-placeholder">${loadError ? "지도를 불러오지 못했어요." : "지도를 표시하려면 카카오 API 키가 필요해요."}<br><span class="mono">index.html 상단의 KAKAO_APP_KEY</span>에 키를 넣어주세요.</div>`;
}
function initMap(){
  const center = defaultCenter();
  map = new kakao.maps.Map(document.getElementById("map"), { center: new kakao.maps.LatLng(center.lat, center.lng), level: 6 });
  placesService = new kakao.maps.services.Places();
  mapReady = true;
  probeSearchability();
  renderFootnote();
  renderMarkers();
  if(!draft && !rawInput.trim()){ renderAdd(); }
}
function createMarkerEl(place){
  const types = place.types && place.types.length ? place.types : ["기타"];
  const mainKey = primaryType(types);
  const typeInfo = allTypes().find(t => t.key===mainKey) || DEFAULT_TYPE_INFO;
  const subKey = types.find(t => t !== mainKey);
  const subIcon = subKey ? (allTypes().find(t => t.key===subKey) || {}).icon : "";
  const wrap = document.createElement("div");
  wrap.className = "pin";
  wrap.style.background = typeInfo.color;
  /* 한 줄 안에서 앞 아이콘은 esc()를 거치고 뒤 아이콘은 안 거치고 있었다(24회차 실측).
     구분값의 아이콘은 사용자가 만들고 **가져오기 파일로도 들어온다** — 그리고 이 앱은
     그 백업 파일을 shareList()로 남에게 보낸다. 받은 파일의 아이콘은 받은 사람이 만든 값이 아니다.
     실측: 파일에 아이콘을 "<img src=x>"로 적으면 8자로 잘린 뒤에도 표식 안에 IMG **요소**가
     생기고 바깥 </span>까지 속성으로 먹혔다. 지금 상한(앱 4자·파일 8자)으로는 스크립트가
     실행되지 않으니 XSS는 아니지만, 그 상한은 이걸 막으려고 둔 게 아니라 화면이 깨지지 않게
     둔 것이다 — 상한을 늘리는 순간 성격이 바뀐다. 한 줄 안에서 두 값을 다르게 다룰 이유가 없다. */
  wrap.innerHTML = `<span class="${subIcon ? 'pin-multi' : ''}">${esc(typeInfo.icon)}${esc(subIcon)}</span>`;
  wrap.title = place.name;
  wrap.addEventListener("click", () => focusPlace(place.id));
  return wrap;
}
function renderMarkers(){
  if(!mapReady) return;
  markerOverlays.forEach(o => o.setMap(null));
  markerOverlays = [];
  const located = visiblePlaces().filter(hasLoc);
  located.forEach(p => {
    const el = createMarkerEl(p);
    const overlay = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(p.lat, p.lng),
      content: el,
      yAnchor: 1
    });
    overlay.setMap(map);
    markerOverlays.push(overlay);
  });
  fitToMarkers(located);
}
function fitToMarkers(located){
  if(located.length === 0) return;
  if(located.length === 1){
    map.setLevel(4);
    map.setCenter(new kakao.maps.LatLng(located[0].lat, located[0].lng));
    return;
  }
  const bounds = new kakao.maps.LatLngBounds();
  located.forEach(p => bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)));
  map.setBounds(bounds);
}
function focusPlace(id){
  const p = places.find(x => x.id===id);
  if(!p || !hasLoc(p)) return;
  if(mapReady){
    map.setLevel(4);
    map.setCenter(new kakao.maps.LatLng(p.lat, p.lng));
  }
  const card = document.querySelector(`.pcard[data-id="${id}"]`);
  if(card){
    card.scrollIntoView({ behavior:"smooth", block:"center" });
    card.classList.add("highlight");
    setTimeout(() => card.classList.remove("highlight"), 1200);
  }
}

function openPicker(initial, onConfirm){
  if(!mapReady){ alert("아직 지도 키가 등록되지 않아서 위치를 지정할 수 없어요. 카카오 키를 추가하면 사용할 수 있어요."); return; }
  pickerCallback = onConfirm;
  const c = initial && initial.lat!=null ? initial : defaultCenter();
  document.getElementById("picker-overlay").classList.remove("hidden");
  requestAnimationFrame(() => {
    if(!pickerMap){
      pickerMap = new kakao.maps.Map(document.getElementById("picker-map"), { center: new kakao.maps.LatLng(c.lat, c.lng), level: 4 });
    } else {
      pickerMap.relayout();
      pickerMap.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
    }
  });
}
function closePicker(){ document.getElementById("picker-overlay").classList.add("hidden"); }

document.getElementById("picker-cancel").addEventListener("click", closePicker);
document.getElementById("picker-confirm").addEventListener("click", () => {
  if(!pickerMap) return;
  const c = pickerMap.getCenter();
  const loc = { lat:c.getLat(), lng:c.getLng() };
  closePicker();
  if(pickerCallback) pickerCallback(loc);
});
/* 위치 권한 — 설명 없이 OS 팝업을 띄우지 않는다.
   예전에는 버튼을 누르는 즉시 브라우저 권한 팝업이 떴다. 아기를 안고 반사적으로 "아니오"를 누르면
   그 뒤로는 눌러도 아무 일이 없어 왜 안 되는지 알 단서가 없었다(QA 반려, 2026-09-18).

   그래서 둘을 지킨다:
     1) 팝업 **전에** 무엇에 쓰는지 한 줄 알리고, 그만둘 수 있게 한다.
     2) 거절당한 뒤에도 **되돌리는 법과 다시 시도할 길**을 남긴다.

   설명을 봤다는 사실은 이 페이지를 여는 동안만 기억한다 — 저장 키를 하나 더 만들지 않으려는
   의도적인 선택이다(이 앱의 localStorage 키는 셋뿐이고 검사가 그것을 고정한다).   */
let geoNoticeShown = false;

function requestMyLocation(onFound){
  if(!navigator.geolocation){
    alert("이 브라우저는 위치 기능을 지원하지 않아요. 지도를 손으로 움직여 지정해 주세요.");
    return;
  }
  if(!geoNoticeShown){
    const ok = confirm("지금 계신 곳으로 지도를 옮기는 데만 써요. 위치는 이 기기 밖으로 나가지 않고 따로 저장하지도 않아요.\n\n계속하면 브라우저가 위치 권한을 물어봅니다.");
    if(!ok) return;   // 설명을 보고 그만두는 것도 정상 경로다 — 아무 말도 덧붙이지 않는다.
    geoNoticeShown = true;
  }
  navigator.geolocation.getCurrentPosition(
    pos => onFound(pos.coords.latitude, pos.coords.longitude),
    err => {
      if(err && err.code === 1){
        // 거절. 다음에 다시 누르면 설명부터 보여준다 — 막다른 길로 두지 않는다.
        geoNoticeShown = false;
        alert("위치 권한이 거절돼 있어요. 주소창 왼쪽의 자물쇠(또는 ⓘ)를 눌러 '위치'를 허용으로 바꾼 뒤 이 버튼을 다시 누르면 돼요.\n\n허용하지 않아도 지도를 손으로 움직여 위치를 지정할 수 있어요.");
      } else {
        alert("위치를 찾지 못했어요. 잠시 뒤 다시 눌러보거나, 지도를 손으로 움직여 지정해 주세요.");
      }
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:60000 }
  );
}

document.getElementById("picker-locate").addEventListener("click", () => {
  if(!pickerMap) return;   // 피커가 열려 있을 때만 닿는 버튼이다.
  requestMyLocation((lat, lng) => pickerMap.setCenter(new kakao.maps.LatLng(lat, lng)));
});
document.getElementById("locate-btn").addEventListener("click", () => {
  if(!mapReady){
    alert("아직 지도 키가 등록되지 않아 내 위치로 옮길 수 없어요.");
    return;
  }
  requestMyLocation((lat, lng) => map.panTo(new kakao.maps.LatLng(lat, lng)));
});

// 목록 안의 동작은 전부 여기서 받는다(이벤트 위임).
// 카드 HTML에 onclick="..." 문자열을 만들지 않기 위한 것 — 장소 이름·구분값처럼 사용자가 정하는
// 값이 코드 문자열에 섞이면 JS 문맥을 탈출할 수 있다. 값은 data-* 속성으로만 오간다.
// 목록은 renderList()가 innerHTML을 통째로 갈아끼우므로, 개별 요소가 아니라 컨테이너에 한 번만 건다.
function wireListDelegation(){
  const list = document.getElementById("list");
  if(!list) return;

  list.addEventListener("click", e => {
    // 가장 안쪽 data-act가 이긴다 — 예전 인라인 핸들러의 event.stopPropagation()과 같은 결과.
    const el = e.target.closest("[data-act]");
    if(!el || !list.contains(el)) return;
    const id = el.dataset.id;
    switch(el.dataset.act){
      case "type-toggle": editToggleType(id, el.dataset.key); break;
      case "edit-age":    editSetAge(id, el.dataset.key); break;
      case "edit-amen":   editToggleAmenity(id, el.dataset.key); break;
      case "edit-cancel": editCancel(id); break;
      case "edit-save":   editSave(id); break;
      case "set-loc":     setLocationFor(id); break;
      case "fav":         toggleFav(id); break;
      case "sat":         setSatisfaction(id, el.dataset.key); break;
      case "del":         requestDelete(id); break;
      case "card":        onCardClick(id); break;
    }
  });

  list.addEventListener("input", e => {
    const el = e.target.closest('[data-act="edit-field"]');
    if(!el || !list.contains(el)) return;
    editUpdateField(el.dataset.id, el.dataset.field, el.value);
  });
}

function boot(){
  document.getElementById("share-btn").addEventListener("click", shareList);
  document.getElementById("export-btn").addEventListener("click", exportBackup);
  document.getElementById("import-btn").addEventListener("click", pickBackupFile);
  wireListDelegation();
  wireTypeAddDelegation();
  loadLocalState();
  loadLocalTypes();
  renderAll();
  initMapOrFallback();
}
boot();
